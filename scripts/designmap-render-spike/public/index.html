<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Design map renderer spike — @xyflow/react in the DSH client-module format</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f8fafc; }
    #root { height: 100%; }
    #boot-error { position: fixed; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #991b1b; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <pre id="boot-error" hidden></pre>

  <!-- The DSH index's queue facade, copied verbatim from
       @deepseek-ai/dsh-client-modules lib/index.js → bootInjections(). -->
  <script>
    (() => {
      const pendingQueue = []
      window.__ModuleLoader__ = {
        mode: 'queue',
        pendingQueue,
        load(registration) { pendingQueue.push(registration) },
        create(options) {
          if (this.mode !== 'queue') throw new Error('client-modules: window.__ModuleLoader__.create called after module-system boot')
          const index = pendingQueue.findIndex((registration) => registration.id === '@deepseek-ai/dsh-client-modules')
          const registration = pendingQueue[index]
          if (registration === undefined) throw new Error('client-modules: HTML did not preload @deepseek-ai/dsh-client-modules/client.js')
          pendingQueue.splice(index, 1)
          const exports = registration.factory((specifier) => {
            throw new Error('client-modules: @deepseek-ai/dsh-client-modules/client.js requested external "' + specifier + '" before the module system existed')
          })
          if (typeof exports !== 'object' || exports === null || typeof exports.createClientModuleSystem !== 'function' || typeof exports.apply !== 'function') {
            throw new Error('client-modules: @deepseek-ai/dsh-client-modules/client.js did not export the bootstrap module face')
          }
          return exports.createClientModuleSystem(this, { id: registration.id, exports }, options)
        },
      }
    })()
  </script>

  <!-- Stand-in for the shell's static module table, built from React 18.3.1. -->
  <script src="/seed.js"></script>
  <!-- The real, unmodified @deepseek-ai/dsh-client-modules/client.js (vendored). -->
  <script src="/vendor/dsh-client-modules.client.js"></script>
  <!-- The spike bundle: registers window.__ModuleLoader__.load({id,factory}). -->
  <script src="/bundle/client.js?rev=spike-1"></script>
  <!-- Create the module system, then import the spike row. -->
  <script src="/boot.js" data-bundle="/bundle/client.js?rev=spike-1"></script>
</body>
</html>
