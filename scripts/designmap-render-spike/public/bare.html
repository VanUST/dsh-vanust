<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Negative control — bare import '@xyflow/react' through the DSH loader</title>
  <style>
    body { margin: 0; padding: 40px; background: #f8fafc; color: #0f172a; font: 14px/1.6 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { max-width: 760px; color: #475569; margin: 0 0 18px; }
    pre { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; white-space: pre-wrap; font: 12px/1.55 ui-monospace, monospace; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Negative control: a bare <code>import '@xyflow/react'</code></h1>
  <p>This bundle was built with <code>@xyflow/react</code> external and no graph row provides it.
     The real DSH module loader must refuse it at materialization. The error is also on
     <code>window.__SPIKE_ERROR__</code>.</p>
  <pre id="boot-error" hidden></pre>
  <div id="root"></div>

  <script>
    (() => {
      const pendingQueue = []
      window.__ModuleLoader__ = {
        mode: 'queue',
        pendingQueue,
        load(registration) { pendingQueue.push(registration) },
        create(options) {
          if (this.mode !== 'queue') throw new Error('client-modules: window.__ModuleLoader__.create called after module-system boot')
          const index = pendingQueue.findIndex((registration) => registration.id === '@deepseek-ai/dsh-client-modules')
          const registration = pendingQueue[index]
          if (registration === undefined) throw new Error('client-modules: HTML did not preload @deepseek-ai/dsh-client-modules/client.js')
          pendingQueue.splice(index, 1)
          const exports = registration.factory((specifier) => {
            throw new Error('client-modules: @deepseek-ai/dsh-client-modules/client.js requested external "' + specifier + '" before the module system existed')
          })
          return exports.createClientModuleSystem(this, { id: registration.id, exports }, options)
        },
      }
    })()
  </script>
  <script src="/seed.js"></script>
  <script src="/vendor/dsh-client-modules.client.js"></script>
  <script src="/bundle/client.bare.js?rev=spike-1"></script>
  <script src="/boot.js" data-bundle="/bundle/client.bare.js?rev=spike-1"></script>
</body>
</html>
