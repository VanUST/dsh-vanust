schemaVersion: 1
groups: []
nodes:
  - id: cli.web
    type: frontend
    label: Web client (browser)
    group: null
    source: null
  - id: db.model
    type: datastore
    label: designmap model
    group: null
    source: designmap/model.yaml
  - id: ext.mcp
    type: external
    label: MCP servers
    group: null
    source: profile/mcp-servers.json
  - id: plug.analysis
    type: service
    label: Analysis record
    group: null
    source: plugins/analysis/store.mjs
  - id: plug.designmap
    type: service
    label: designmap (this panel)
    group: null
    source: plugins/designmap/index.js
  - id: plug.presentation
    type: service
    label: presentation + dashboard tools
    group: null
    source: plugins/presentation/index.js
  - id: plug.role-model
    type: service
    label: Role model route
    group: null
    source: plugins/role-model/role-model.mjs
  - id: plug.skills
    type: service
    label: Skills library
    group: null
    source: plugins/skills/index.js
  - id: plug.taskboard
    type: service
    label: Taskboard
    group: null
    source: plugins/taskboard/index.js
  - id: svc.host
    type: service
    label: DSH host process
    group: null
    source: profile/cordis.patch.yml
  - id: svc.orchestrator
    type: service
    label: Orchestrator
    group: null
    source: plugins/orchestrator/orchestrator.mjs
edges:
  - id: e.designmap.model
    from: plug.designmap
    to: db.model
    kind: data
    label: reads model
  - id: e.designmap.web
    from: plug.designmap
    to: cli.web
    kind: async
    label: scene + panel
  - id: e.host.mcp
    from: svc.host
    to: ext.mcp
    kind: sync
    label: mcp__* tools
  - id: e.host.orch
    from: svc.host
    to: svc.orchestrator
    kind: sync
    label: tool calls
  - id: e.orch.analysis
    from: svc.orchestrator
    to: plug.analysis
    kind: sync
    label: analysis_* gate
  - id: e.orch.designmap
    from: svc.orchestrator
    to: plug.designmap
    kind: sync
    label: designmap_* tools
  - id: e.orch.presentation
    from: svc.orchestrator
    to: plug.presentation
    kind: async
    label: presenter preset renders a deck
  - id: e.orch.skills
    from: svc.orchestrator
    to: plug.skills
    kind: sync
    label: skill_* tools
  - id: e.orch.taskboard
    from: svc.orchestrator
    to: plug.taskboard
    kind: sync
    label: task_* tools
  - id: e.web.host
    from: cli.web
    to: svc.host
    kind: sync
    label: HTTP + SSE
  - id: plug.role-model.to.svc.orchestrator
    from: plug.role-model
    to: svc.orchestrator
    kind: sync
    label: route of the ARCHITECT role
  - id: svc.host.to.plug.role-model
    from: svc.host
    to: plug.role-model
    kind: sync
    label: mounts the role route
