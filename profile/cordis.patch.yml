# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── notify: ONE card when a CORE chat agent finishes or asks ─────────────────
# Root chats only. A child is filtered by any of its three marks - delegationDepth, a
# parentSession, or origin 'subagent' - because a `subagent` child can report depth 0 while
# still being somebody's helper.
#
# "Finished" means STAYED idle: after `running -> idle` the plugin waits `settleMs`, and a
# continuation that starts inside that window cancels the line. A goal-driven job posts a
# summary per round and starts the next round immediately; without this the human gets one
# popup per round instead of one when the job is actually done.
#
# The finished sessions share ONE card - a line each - replaced as sessions join it, and one
# dismissal clears them all. A popup per session is what made three chats cost three clicks.
# `user-questions/request` is the other seam: it is the waterfall the ask-user path calls
# before it waits, and its listener announces before calling next(), so the card is there
# while the human is being waited on.
#
# It spawns a detached notifier and can never touch a turn: no tool, no prompt section, no
# service. Linux uses a Tk overlay; Windows a TopMost WinForms form; macOS the desktop
# notification. Silence it with DSH_NOTIFY_DISABLED=1.
- insert:
    - id: notify
      name: '@cc/dsh-notify'
      config:
        minRunMs: 15000
        settleMs: 8000
        onFinish: true
        onQuestion: true
        dismissMs: 0

# ── image window: only the newest screenshots stay in the request ───────────
# The harness satisfies a route's image budget REACTIVELY: the adapter rejects the
# request, @deepseek-ai/dsh-compaction-image-offload then removes the OLDEST images
# and retries - a head rewrite, so the provider re-bills the whole context from there.
# Measured 2026-11-10 (session-1cb0708d, kimi-coding, 532K context, 95 pasted
# screenshots in 13 batches): 6 offloads re-billed 1,783,829 of 2,260,222 fresh
# tokens. This row makes the window a sliding one: the image that falls out is
# dropped as the new one arrives, so the rewrite sits at the tail (~440K projected
# for the same session instead of 1,783,829). keepImages: 1 suits screenshot
# reading; raise it when a task compares several images.
- insert:
    - id: image-window
      name: '@cc/dsh-image-window'
      config:
        keepImages: 1

# ── tail-pruner: the cache break stays at the tail ──────────────────────────
# The harness pruner (dsh-compaction-tool-result-pruner) runs only after the context
# crossed the compaction threshold and rewrites EVERY result over 8192 characters from
# the OLDEST. The earliest rewritten node sits near the head, so the next request
# re-bills almost the whole context: measured 2026-11-20 over three days (22 938 steps,
# 5.56 B tokens of prompt, 99.13% cached), 53 prune passes paid 12.2 M of the 48.2 M
# fresh tokens. This row prunes NEWEST-first, only above its own budget and only until
# the projection fits it, so the break sits at the tail; the newest protectResults stay
# intact. budgetRatio 0.45 sits under the 0.5 compaction threshold of the 1M windows;
# the 272K Codex window gets 0.75 so it is not pruned early. The harness pruner and
# compaction stay mounted as the safety net.
- insert:
    - id: tail-pruner
      name: '@cc/dsh-tail-pruner'
      config:
        budgetRatio: 0.45
        protectResults: 3
        routes:
          - provider: openai-codex
            budgetRatio: 0.75

# ── diagrams: schemes the agent draws, shown by the file preview ────────────
# Contributes one tool, `diagram`, which turns a JSON diagram spec into a standalone
# HTML file whose SVG is inline. Four kinds over one contract — flow (flowcharts and
# algorithm illustrations), arch (layered system design), sequence and state — because a
# scheme is a description of relationships, not of coordinates: the agent supplies nodes
# and edges and the plugin computes every position.
#
# No client half on purpose: the Sidebar document preview
# already renders `.html` in a script-enabled sandboxed frame, so the document is its own
# viewer and the file the user prints is the file the agent wrote. The layout engine is
# dependency-free on purpose — a vendored renderer would put megabytes into every diagram
# and a supply chain into the plugin.
- insert:
    - id: diagrams
      name: '@cc/dsh-diagrams'

# ── presentation: a deck and a board the preview can show ───────────────────
# Contributes two tools, `presentation` (a slide deck) and `dashboard` (a KPI
# board). Both turn a JSON spec into ONE standalone HTML file whose CSS, player
# and charts are inline, so the file opens in the Sidebar document preview (a
# sandboxed frame with an opaque origin), in a browser and in a PDF printer with
# no network and no sibling file. The five themes and every component live in one
# `theme.css`; the animation engine is CSS plus `requestAnimationFrame` — a
# vendored library would put ~190 KB of `motion` into every deck for the same
# 150–320 ms ease-out, and `openmotion` is a Next.js runtime that cannot run in a
# static page (the decision is in docs/ARCHITECTURE.md; the survey and numbers are in git history).
# The host half registers the tools for the `presenter` and `ux` seats only; the
# tool-families row is the second gate.
- insert:
    - id: presentation
      name: '@cc/dsh-presentation'

# ── designmap: one Excalidraw page per design map ─────────────────────────
# The single design map lives in `designmap/pages/<slug>.excalidraw`; the page is the
# whole document. The human edits it in Project state -> Map, which is always an editor
# that fills the panel and can go full screen; the agent uses five host tools (map_list,
# map_read, map_lint, map_edit, map_render). map_edit draws a whole scheme with the
# `diagram` op and map_lint names every readability defect with a repair. A headless
# Excalidraw run renders a page to a clean PNG/SVG. There is no model, view, overlay,
# annotation or manifest file behind it.
- insert:
    - id: designmap
      name: '@cc/dsh-designmap'
      config:
        dir: designmap
        presets:
          - orchestrator
          # The design map is the architect's artifact: the role reads, records and repairs it,
          # and with the role left out of this list its allowed designmap tools never registered
          # (measured 2026-11-19: an architect session carried no designmap tool at all).
          - architect

# ── test-cases: observed test cases persisted in docs/cases/ ────────────────
# Twelve schema-enforced host tools over a repo-tracked library: case_record,
# case_update (compare-and-set), case_verify (the manual observation, with the
# directory it was taken in), case_run (executes the stored command in `cwd`),
# case_suite, case_gate, case_list, case_get, case_supersede, case_deprecate,
# case_remove and case_drift. The rule is "observe first, then persist - no
# speculative tests"; a documented-only case keeps its requirement and a named
# reason, and a changed surface file marks a case stale instead of deleting it.
# The tools are granted per preset: the orchestrator only gets the intake subset
# (record/list/get/drift/gate), so it can capture a human requirement without
# ever claiming a verification it did not run; the backend, which owns the case,
# also gets case_update and case_verify; the reviewer gets case_verify but never
# case_update. A command pinned to one checkout by an absolute path is refused
# (PINNED_COMMAND).
- insert:
    - id: test-cases
      name: '@cc/dsh-test-cases'

# ── analysis: analysis before decomposition ────────────────────────────────
# One repo-tracked Analysis Record per initiative in docs/analysis/, with CAS on
# `expectedRev`, an atomic temp-file + rename and a semantic fingerprint. Four
# root-only tools (analysis_read / analysis_upsert / analysis_check /
# analysis_impact) keep the business outcome separate from the requested solution
# and trace each requirement through process -> component -> task -> evidence.
# `delegate_task` reads the service through ctx.get('analysis') (it is NOT in the
# orchestrator's inject, so an absent row keeps legacy delegation): L0 passes
# without a document, L1/L2 are refused analysis_required without a ready record
# and analysis_stale after an affected requirement. The trace lives ONLY here;
# the taskboard keeps its schema.
- insert:
    - id: analysis
      name: '@cc/dsh-analysis'
      config:
        dir: docs/analysis

# ── project-rules: one cached prompt section the human edits ─────────────────
# `.dsh/rules.md` becomes the `project:rules` section on every agent and subagent.
# The text is frozen per turn and the previous string is kept when the bytes do not
# change, so typing in the panel cannot invalidate the provider's cached prefix; a
# save only writes the file and the next turn's boundary picks it up. Empty file =
# no section. The panel reads through workspaceFiles and saves through the command.
- insert:
    - id: project-rules
      name: '@cc/dsh-project-rules'
      config:
        file: .dsh/rules.md

# ── subagent capacity: no two-child cap ────────────────────────────────────
# `@cc/dsh-work-modes` is NOT mounted. Its one job was a monotonic tools.guard()
# that refused the third `subagent` child of a session, and its default limit is
# 2 — the number the operator hit. Removing the cap is deliberate: the deployment
# would rather pay for breadth when it asks for it than have a guard decide that
# the third parallel read is one too many. The package and its tarball stay in
# the kit (inventory row `mounted: false`) so re-enabling it is one row, not a
# rebuild.
#
# What stops runaway fan-out instead is the harness's own pool, and its default
# is 8. Raising it here rather than leaving it at 8 is the point of the change:
# dropping a cap of 2 only to collide with a cap of 8 a week later would be the
# same surprise twice. The knobs are the subagent service's: `maxActiveSubagents`
# is the concurrent child count across one main agent, `maxDepth` is nesting and
# stays at the default 1 because deeper nesting is a different decision.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxActiveSubagents: 64

# ── godot-mcp: a declarative, transferable MCP server list ──────────────────
# The harness ships an MCP client bridge (`@deepseek-ai/dsh-mcp-client`), so this
# plugin speaks no MCP itself. It owns the three things the bridge does not do:
# the canonical server list, the resolution of the `uvx` launcher that the Godot
# AI bridge cannot start without, and the Godot project directory that bridge
# must be started in.
#
# Why a plugin and not a row in this file. A hand-written row here would carry a
# version pin that has to track the addon committed in the project, and the value
# of a spec is that the pin lives in one place that a check can compare. The row
# the loader actually reads is written into the harness HOME patch layer
# (`$DSH_HOME/cordis.patch.yml`, applied over every profile) by
# `scripts/dsh-mcp-sync.mjs`, which imports this plugin's own `buildRow`, so the
# spec format and the row shape cannot drift apart. The HOME layer is used rather
# than this profile layer because one row then serves every profile.
#
# The plugin needs no harness package: it reads one JSON file and contributes one
# system-prompt section that reports, per declared server, whether its launcher
# was found. Everything else - connecting, naming tools `mcp__<server>__<tool>`,
# reconnecting, projecting results - is the shipped bridge's job and is fixed by
# its own tests.
- insert:
    - id: godot-mcp
      name: '@cc/dsh-godot-mcp'

# ── skills: the deployment's reusable instructions ─────────────────────────
# Twenty runtime skills in one tarball: Ponytail's lazy-senior discipline,
# grill-me/grilling, Karpathy clear-writing/explain-webpage/explain-diagram
# (adapted to the local `diagram` tool), the UI builder loop, the proof-not-tests
# ruling, the literature-review procedure, and five added on 2026-10-26:
# tests-that-could-fail (a check must be able to fail), visual-explanations (one
# system across deck/diagram/page/animation), ui-testing (role-first, state
# matrix, negative run), ui-design-system (tokens, states, layout patterns), and
# research-first (read the current source before writing), and six added on
# 2026-11-09 for UX/UI testing: canvas-test-bridge (a gated window.__APP_TEST__),
# property-based-domain-tests (Vitest + fast-check), visual-golden-tests
# (pixelmatch + Argos), a11y-keyboard-audit (axe-core + keyboard walk),
# maestro-mobile-flows, and test-run-observability (JSONL events + traces). They register through
# `ctx.skills.register`, so the tarball is the source of truth and no machine
# needs a copy under $DSH_HOME/skills. `grill-me` stays user-invocable; the model
# reaches the procedure through `grilling`.
- insert:
    - id: skills
      name: '@cc/dsh-skills'

# ── papers: arXiv/HF search, trending, PDF text ────────────────────────────
# One host-only tool family for the literature-review skill. Public APIs, no key;
# results are normalised across arXiv and Hugging Face, and a source failure is
# reported while the other source still returns.
- insert:
    - id: papers
      name: '@cc/dsh-papers'

# ── flash-guard: delegated work stays on flash ─────────────────────────────
# The default model is already deepseek-flash, but a workflow script can name
# another route. This listener runs after `agent/request` resolves the frozen
# LlmCallConfig and REFUSES a child's route unless it is listed below;
# `enforceRoot: false` keeps the human's own model choice intact. External
# providers do not route through this seam. The old `maxReasoningEffort` cap is
# gone: the effort is part of the same frozen selection and lowering it here threw
# the turn (`dsh-agent-loop` compares provider, model AND effort).
#
# Two rules, because they answer different questions. `allowedRoutes` says what a
# CHILD may run on, so a child may be routed to either Kimi tier deliberately
# rather than always collapsing to flash; `deniedModels` says what NOBODY may run
# on, root included, and a match is refused rather than rewritten. Highspeed
# variants are the deny case: they cost twice to three times the tokens for speed
# this work does not need, and a silent substitution would spend the budget the
# rule exists to protect. The Kimi model list in the `llm-pi-ai` row below already
# omits them, so the deny pattern is the second line of defence, not the only one.
- insert:
    - id: flash-guard
      name: '@cc/dsh-flash-guard'
      config:
        provider: deepseek-official
        model: deepseek-flash
        # Refuse, never rewrite: dsh freezes a child's route before `agent/request`, so a
        # plugin that returns a different provider/model/effort now throws inside the turn
        # (`dsh-agent-loop`: 'use agent.model.select() before step preparation'). The guard
        # keeps the policy and loses only the substitution.
        onViolation: refuse
        enforceRoot: false
        allowedRoutes:
          - provider: deepseek-official
            model: deepseek-flash
          - provider: kimi-coding
            model: k3.1-pro
          - provider: kimi-coding
            model: kimi-for-coding
          # The ARCHITECT role's own route (`@cc/dsh-role-model` selects it for that preset and
          # for nobody else). It must be listed here or the guard refuses every delegated
          # architect child: the child's route is decided before `agent/request` runs. It is NOT
          # in `subagent-model-selection-settings.allowedModels`, so a `workflow` script still
          # cannot name it explicitly, and `delegate_task` cannot ask for it either.
          - provider: openai-codex
            model: gpt-6.2-sol
        deniedModels:
          - '*highspeed*'

# ── proof-guard: the no-autotest ruling at the write seam ───────────────────
# A `tools/pre-execute` waterfall on write/edit: a test path needs a PROOF
# header naming the production behavior and the failure it prevents. `mode: deny`
# is the default; `warn` is the trial mode. The guard reads an existing file so a
# legacy test is not trapped. This is friction, not proof: the skill and
# human review remain the real check.
- insert:
    - id: proof-guard
      name: '@cc/dsh-proof-guard'
      config:
        mode: deny
        # THE TESTER'S WRITE SCOPE (P1). An independent acceptance tester that can edit the
        # product can make its own test green: the scope is what keeps the two jobs apart. The
        # paths are the case library and the test roots; a product file is refused WRITE_SCOPE
        # before the tool runs. Other presets have no row and keep their full surface.
        roles:
          tester:
            # Only the case library and the test ROOTS. A product file named *.test.* outside
            # tests/ is the product (B3): a global '**/*.test.*' allowed it by name, which is the
            # one thing the scope exists to prevent. A test belongs in test/ or tests/.
            allow:
              - docs/cases/
              - test/
              - tests/

# ── tool-families: each preset gets only the tool families its job needs ────
# MCP tools are registered at the HOST by the bridge rows above, before a preset is chosen,
# so a preset cannot unregister them; the tools registry does have the seam
# (`tools.restrict`, agent-scoped, re-derives the visible schema set), and this row is it.
# Measured on a real BACKEND child (2026-11-13): of 114,989 B of tool schema, `mcp__godot__*`
# was 60,679 B (52.8%) and `mcp__playwright__*` 16,280 B (14.2%), every kit tool ~20%.
#
# Two kinds of denial, because they answer different questions:
#   deny        - this role never gets the family (the orchestrator does not drive browsers).
#   projectDeny - the family is a PROJECT bridge, so it is kept only where the project is:
#                 `mcp__godot__*` appears for a session whose cwd holds `project.godot`.
#                 Registering it per preset instead would spawn one MCP bridge per agent.
# `hindsight_*` is in no row on purpose: a memory tool a child can call is a capability, and
# the automatic recall/write-back stays root-only inside the plugin.
# `standard` (no preset) and any preset without a row keep their full surface.
# The restriction is applied at `agent/created` and retried once at the first `agent/pre-step`
# if the host layer had no names yet (both before that step's request header exists).
- insert:
    - id: tool-families
      name: '@cc/dsh-tool-families'
      config:
        projectMarkers:
          'mcp__godot__*': project.godot
        # ALLOW LIST (V1.1, 2026-11-17). Until this change the eight rows below named only
        # what to remove, so every new host tool (MCP bridge, Hindsight, outline, babysitter)
        # was handed to every role: measured headers 2026-11-17 were orchestrator 109 tools /
        # 99 227 B of schema, backend 56 / 42 454 B, and all 8 Hindsight tools (6 430 B) sat
        # in every child header although the child journals show 9 Hindsight calls in total.
        # A row with `allow` now describes the whole role surface: a tool that matches no
        # allow pattern is removed, whether it existed when the row was written or not.
        # Budgets: orchestrator <=40, backend <=16, reviewer <=14, critic <=14, gatherer
        # <=10, research <=14, docs <=14, ux <=40. A preset WITHOUT a row (standard, cordis,
        # ptc and any unknown preset) keeps its full surface - D8.
        # No row allows `mcp__godot__*` (it is ~30 tools / 60 KB and no eight-preset budget
        # holds it); `projectMarkers`+`projectDeny` stay supported for a row that needs a
        # family only on a project that can drive it.
        # CONTEXT BUDGETS (FR2, D13) live with the family policy: one owner for the role
        # surface and its size. `tools` is the declared allowance for the role as measured on
        # 2026-11-17; `recommended` is the design table (a count above it is a WARNING); a count
        # above 1.5 x `tools` is RED and fails `make verify`. Byte budgets are warnings; a PTC
        # session (at most two tools in its header) is measured against the mode's own baseline
        # (~53 KB system prompt), never against a native preset's 24-25 KB.
        budgets:
          orchestrator:
            # 2026-11-18: 54 measured tools -> 42 after the allow list started applying to
            # per-agent registrations and eight zero-use tools left the row. The floor is the
            # preset's own 15 tools, which tools.restrict cannot mask.
            tools: 45
            recommended: 42
            schemaBytes: 56000
            promptBytes: 26000
            remindersBytes: 70000
          architect:
            # Measured on the first real session after the preset shipped; the floor is the
            # preset's own seven tools (read, glob, grep, edit-less fs, skill-less), which
            # tools.restrict cannot mask. The role's whole reason to exist is a small prefix, so
            # its allowance is on the declared surface (12) and not on the deployment default.
            tools: 15
            recommended: 12
            schemaBytes: 20000
            promptBytes: 12000
            # Measured 2026-11-19 on the first real ARCHITECT session: 15 309 B, of which the
            # Hindsight guide its own plugin injects into every root is 7 932 B and the state
            # digest 3 312 B. No skill catalog (30 304 B in the orchestrator session this role
            # replaces). The budget is the measurement plus a little headroom, not a guess.
            remindersBytes: 16000
          ux:
            tools: 52
            recommended: 40
            schemaBytes: 60000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          presenter:
            # The role's allow list is 22 entries, but `mcp__playwright__*` expands to a
            # family of tools, so the kept set is larger than the list: the policy proof
            # measures 32 kept names against the synthetic header (2026-11-20), which is
            # why the declared allowance is 36 rather than 22. `recommended` is the
            # design table; the real child header is measured on the second server.
            tools: 36
            recommended: 32
            schemaBytes: 60000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          backend:
            tools: 28
            recommended: 16
            schemaBytes: 45000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          reviewer:
            tools: 25
            recommended: 14
            schemaBytes: 43000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          critic:
            tools: 24
            recommended: 14
            schemaBytes: 40000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          # The independent acceptance tester: a shell to run drivers and copies of the previous
          # version, read/search, scoped write/edit, the full case surface and the two board tools.
          # No browser, no Godot, no present, no PTC: the driver is a script, not a UI session.
          tester:
            tools: 30
            recommended: 20
            schemaBytes: 50000
            promptBytes: 26000
            remindersBytes: 70000
          gatherer:
            tools: 16
            recommended: 10
            schemaBytes: 30000
            promptBytes: 26000
            remindersBytes: 70000
          research:
            tools: 23
            recommended: 14
            schemaBytes: 42000
            promptBytes: 26000
            remindersBytes: 70000
          docs:
            tools: 26
            recommended: 14
            schemaBytes: 45000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          # The runtime lane. Its own plugin rows are a shell, the file tools, jobs,
          # skills, web and todo (13 tools); the case and board tools come from host
          # rows gated per preset. The allowance covers that surface plus the harness's
          # own fs/search/skill rows, which tools.restrict cannot mask. No budget for
          # PTC: the preset does not mount it.
          devops:
            tools: 26
            recommended: 20
            schemaBytes: 45000
            promptBytes: 26000
            remindersBytes: 70000
        families:
          # Root: the board, delegation, the analysis record, the design map, files and the
          # read half of Hindsight (D4 keeps Hindsight at the root; the write tools are out).
          # TUNED 2026-11-18 from 127 root sessions (9082 tool calls): dropped every tool with
          # zero or near-zero root use - designmap export/open/scan/render, task link/pause/
          # resume/remove, hindsight_reflect; added the case-intake subset and delegation_brief,
          # which the root does use but the list never named (so they bypassed the policy).
          # Floor: the preset's own 15 tools (fs, search, skill, goal, ask, todo, web, present)
          # cannot be masked by tools.restrict; the root surface is ~42, not 30.
          orchestrator:
            allow:
              - analysis_check
              - analysis_impact
              - analysis_read
              - analysis_upsert
              - ask_user_question
              - case_drift
              - case_get
              - case_list
              - case_record
              - codex_signin_cancel
              - codex_signin_start
              - codex_signin_status
              - delegate_task
              - delegation_brief
              - edit
              - glob
              - grep
              - map_edit
              - map_lint
              - map_list
              - map_read
              - map_render
              - mcp__godot__*
              - hindsight_list_pages
              - hindsight_read_page
              - hindsight_search_pages
              - outline
              - present
              - read
              - skill
              - skill_evolve
              - skill_inventory
              - task_batch
              - task_cancel
              - task_close
              - task_create
              - task_get
              - task_list
              - task_note
              - task_stop
              - task_update
              - todo_write
              - web_fetch
              - web_search
              - write
            projectDeny:
              - mcp__godot__*
          # The costly route: the decision surface only (D13, and the owner's 2026-11-19 brief).
          # `delegate_task` is the context seam (registered on root agents only, so a delegated
          # architect reads its brief instead); the design map is its artifact; the three Hindsight
          # read tools make the guide its plugin injects into every root truthful; web_fetch and
          # web_search read the source a decision cites. No bash, no write/edit, no skill catalog,
          # no task-board writes, no case tools.
          architect:
            allow:
              - delegate_task
              - glob
              - grep
              - hindsight_list_pages
              - hindsight_read_page
              - hindsight_search_pages
              - map_edit
              - map_lint
              - map_list
              - map_read
              - map_render
              - outline
              - read
              - task_note
              - web_fetch
              - web_search
            projectDeny:
              - mcp__godot__*
          # Implementation role: files, a shell, the two board tools a worker needs
          # (task_get/task_note), the case runner and the three intake case tools.
          backend:
            allow:
              - bash
              - case_get
              - case_list
              - case_record
              - case_run
              - edit
              - glob
              - grep
              - job_output
              - outline
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - write
          # Verification: read-only code access plus the case library; no write/edit (the
          # role contract), no shell beyond bash for the proof runs.
          reviewer:
            allow:
              - bash
