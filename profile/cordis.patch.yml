# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── notify: a persistent popup when a CORE chat agent finishes or asks ───────
# Root chats only: delegated subagents never raise a popup. Two seams, no guesswork:
# `agent/status` with a `running -> idle` transition IS the turn
# having ended, and `user-questions/request` is the waterfall the harness's ask-user path
# calls before it waits - listening there rather than to a tool name means any caller that
# asks notifies. The listener announces and then calls next(), so the popup arrives while the
# human is being waited on.
#
# It spawns a detached notifier and can never touch a turn: no tool, no prompt section, no
# service. Linux uses notify-send; Windows a WinRT toast through powershell.exe with a tray
# balloon fallback, its text carried in environment variables and XML-escaped in-script, so a
# question containing quotes is text rather than syntax. Silence it with DSH_NOTIFY_DISABLED=1.
- insert:
    - id: notify
      name: '@cc/dsh-notify'
      config:
        minRunMs: 15000
        onFinish: true
        onQuestion: true
        dismissMs: 0

# ── presentation: decks the agent renders, shown by the file preview ────────
# Contributes one tool, `presentation`, which turns a JSON deck spec into a
# standalone HTML file in the session workspace. There is no client half on
# purpose: the Sidebar document preview already renders `.html` in a script-
# enabled sandboxed frame, so the deck is its own viewer, and the very file the
# user previews is the one they export and print — preview, export and PDF cannot
# drift apart because they are the same document.
- insert:
    - id: presentation
      name: '@cc/dsh-presentation'

# ── diagrams: schemes the agent draws, shown by the file preview ────────────
# Contributes one tool, `diagram`, which turns a JSON diagram spec into a standalone
# HTML file whose SVG is inline. Four kinds over one contract — flow (flowcharts and
# algorithm illustrations), arch (layered system design), sequence and state — because a
# scheme is a description of relationships, not of coordinates: the agent supplies nodes
# and edges and the plugin computes every position.
#
# No client half, for the same reason presentation has none: the Sidebar document preview
# already renders `.html` in a script-enabled sandboxed frame, so the document is its own
# viewer and the file the user prints is the file the agent wrote. The layout engine is
# dependency-free on purpose — a vendored renderer would put megabytes into every diagram
# and a supply chain into the plugin.
- insert:
    - id: diagrams
      name: '@cc/dsh-diagrams'

# ── work-modes: the subagent delegation cap ────────────────────────────────────
# One deployment policy on the harness seam that can actually refuse something.
#
# The cap is a monotonic tools.guard(): the third `subagent` child of one session
# (grandchildren included) is refused before its body runs, with the two running
# agents named, so the calling agent decides whether to batch, finish its own step
# or retry. A `workflow` fan-out is deliberately OUTSIDE this cap — it is a cap on
# the delegation tool, not a ceiling on concurrent work.
#
# The cap's residual, stated where the cap is: a child this process can see keeps
# its slot until the harness's agent registry stops holding it, so a child the
# registry never disposes keeps its slot for as long as it is held; an entry NO
# registry answered for (an out-of-process child, no `agents` service, a liveness
# probe that threw) is released by the age bound instead, so it stops being counted
# after `staleAfterMs` while it may still be running. That is the strongest true
# statement, and the plugin's own header carries it beside the code.
#
# There are NO work modes: the research/implementation mode was removed with the
# decision-record machinery it rested on, and the plugin injects no prompt section.
- insert:
    - id: work-modes
      name: '@cc/dsh-work-modes'

# ── godot-mcp: a declarative, transferable MCP server list ──────────────────
# The harness ships an MCP client bridge (`@deepseek-ai/dsh-mcp-client`), so this
# plugin speaks no MCP itself. It owns the three things the bridge does not do:
# the canonical server list, the resolution of the `uvx` launcher that the Godot
# AI bridge cannot start without, and the Godot project directory that bridge
# must be started in.
#
# Why a plugin and not a row in this file. A hand-written row here would carry a
# version pin that has to track the addon committed in the project, and the value
# of a spec is that the pin lives in one place that a check can compare. The row
# the loader actually reads is written into the harness HOME patch layer
# (`$DSH_HOME/cordis.patch.yml`, applied over every profile) by
# `scripts/dsh-mcp-sync.mjs`, which imports this plugin's own `buildRow`, so the
# spec format and the row shape cannot drift apart. The HOME layer is used rather
# than this profile layer because one row then serves every profile.
#
# The plugin needs no harness package: it reads one JSON file and contributes one
# system-prompt section that reports, per declared server, whether its launcher
# was found. Everything else - connecting, naming tools `mcp__<server>__<tool>`,
# reconnecting, projecting results - is the shipped bridge's job and is fixed by
# its own tests.
- insert:
    - id: godot-mcp
      name: '@cc/dsh-godot-mcp'

# ── skills: the deployment's reusable instructions ─────────────────────────
# Nine runtime skills in one tarball: Ponytail's lazy-senior discipline,
# grill-me/grilling, Karpathy clear-writing/explain-webpage/explain-diagram
# (adapted to the local `diagram` tool), the UI builder loop, the proof-not-tests
# ruling, and the literature-review procedure. They register through
# `ctx.skills.register`, so the tarball is the source of truth and no machine
# needs a copy under $DSH_HOME/skills. `grill-me` stays user-invocable; the model
# reaches the procedure through `grilling`.
- insert:
    - id: skills
      name: '@cc/dsh-skills'

# ── papers: arXiv/HF search, trending, PDF text ────────────────────────────
# One host-only tool family for the literature-review skill. Public APIs, no key;
# results are normalised across arXiv and Hugging Face, and a source failure is
# reported while the other source still returns.
- insert:
    - id: papers
      name: '@cc/dsh-papers'

# ── flash-guard: delegated work stays on flash ─────────────────────────────
# The default model is already deepseek-flash, but a workflow script can name
# another route. This listener runs after `agent/request` resolves the frozen
# LlmCallConfig and rewrites a child's route to flash before dispatch; with
# `onViolation: refuse` it throws instead. `enforceRoot: false` keeps the human's
# own model choice intact. External providers do not route through this seam.
- insert:
    - id: flash-guard
      name: '@cc/dsh-flash-guard'
      config:
        provider: deepseek-official
        model: deepseek-flash
        onViolation: rewrite
        enforceRoot: false
        maxReasoningEffort: high

# ── proof-guard: the no-autotest ruling at the write seam ───────────────────
# A `tools/pre-execute` waterfall on write/edit: a test path needs a PROOF
# header naming the production behavior and the failure it prevents. `mode: deny`
# is the default; `warn` is the trial mode. The guard reads an existing file so a
# legacy test is not trapped. This is friction, not proof: the skill and the
# handoff evidence remain the real check.
- insert:
    - id: proof-guard
      name: '@cc/dsh-proof-guard'
      config:
        mode: deny

# ── taskboard: the workspace task ledger ───────────────────────────────────
# One `.dsh/taskboard.json` per workspace, with objective, scope, non-scope,
# acceptance, status, results and a timeline. Model tools and the `/taskboard`
# command share one service. The client half replaces the `subagent-catalog`
# header cell and adds a Tasks main panel + sidebar entry; it reads through
# `workspaceFiles` and writes through the command Remote, so it needs no custom
# Typert namespace.
- insert:
    - id: taskboard
      name: '@cc/dsh-taskboard'
      config:
        file: .dsh/taskboard.json
        maxTasks: 200
        timelineLimit: 120

# ── orchestrator: the root agent plans, delegates and integrates ─────────────
# Root-only policy section + root-only `delegate_task`; child-only specialist
# section. The taskboard service must be mounted first; `inject` waits for it.
# The delegation tool creates the task, renders a self-contained brief, starts a
# flash child with `agentOptions`, and links the child id.
- insert:
    - id: orchestrator
      name: '@cc/dsh-orchestrator'
      config:
        provider: spawn
        childProvider: deepseek-official
        childModel: deepseek-flash
        promptSections: true

# ── handoff: one readable page per task ────────────────────────────────────
# Structured result -> self-contained A4 HTML + optional PDF through the
# installed Chrome. The HTML is the source of truth; a missing browser is a
# warning, not a failed tool.
- insert:
    - id: handoff
      name: '@cc/dsh-handoff'

# ── rtk: command-aware shell output, compressed where it enters the context ──
# The output half of RTK. Upstream rewrites the COMMAND through a Claude Code
# PreToolUse hook; this harness's `tools/pre-execute` cannot rewrite arguments at
# all, so the plugin listens on `tools/post-execute` instead: an oversized result
# from a recognised single command is piped through `rtk pipe -f <filter>` and the
# model-facing projection is replaced, with a banner that keeps the elision visible
# and names how to get the full text back. The binary is resolved from PATH and the
# per-user install locations, never from a baked-in path. Nothing here runs when
# rtk is absent: the prompt section says so and the listener no-ops.
- insert:
    - id: rtk
      name: '@cc/dsh-rtk'

# ── skill-evolve: the skill library grows instead of rotting ────────────────
# The harness already discovers `<name>/SKILL.md` under $DSH_HOME/skills and
# re-reads a body on every load, so the missing half is discipline, not plumbing:
# write with a validated name and size, keep the previous body, refuse to
# overwrite a human's skill, and find the duplicates. That is SkillClaw's useful
# half without its proxy, its Python, or a second process. The model proposes the
# procedure; these tools enforce the rules.
- insert:
    - id: skill-evolve
      name: '@cc/dsh-skill-evolve'

# ── babysitter: a deterministic process, tracked as one task ─────────────────
# Babysitter has no adapter for this harness among its twelve, so the plugin
# shells out to the installed CLI instead of pretending to be one. The mapping is
# the point: ONE babysitter run is ONE taskboard task, each journal step becomes a
# timeline note, and the task lands in `review` for a human — never `done`, because
# the run finishing is not the same as the work being accepted. The taskboard is
# injected optionally, so the tools still work on a machine without it; with no
# CLI installed every tool answers with the install line instead of a stack trace.
- insert:
    - id: babysitter
      name: '@cc/dsh-babysitter'

# ── replace the subagent catalog with the taskboard ────────────────────────
# The taskboard's header cell reuses the `subagent-catalog` id; the shipped
# client package registers that id first and cannot share the cell. Disabling
# the client package removes the lineage popover (the window this deployment is
# replacing) while the host-side subagent tools, lifecycle and session child
# conversations remain. Child sessions are opened from the task detail.
- id: ui-subagent
  name: '@deepseek-ai/dsh-client-ui-subagent'
  disabled: true

# ── machine rows that were living ONLY in the installed profile ─────────────
# These two rows were appended to $DSH_HOME/profiles/web/cordis.patch.yml by hand
# on an earlier day and never came back to the kit. The kit's managed-seed rule
# reports a hand-edited profile patch and leaves it alone, so the kit and this
# machine had drifted and `kit-update --check` reported profile drift forever.
# Folding them in is the kit's own rule applied: the machine is a projection of
# the kit, so configuration worth keeping lives HERE, not in the installed copy.
#
# The welcome notice is pinned to the version the operator has already seen; it is
# a suppression marker, not a feature flag. The default model is the deployment's
# model policy (flash, maximum reasoning effort on the root agent) — the same
# choice flash-guard and model-gate assume, now stated once, portably.
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
