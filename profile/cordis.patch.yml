# ── taskboard: the workspace task ledger ───────────────────────────────────
# One `.dsh/taskboard.json` per workspace, with objective, scope, non-scope,
# acceptance, status, results and a timeline. Model tools and the `/taskboard`
# command share one service. The client half replaces the `subagent-catalog`
# header cell and adds a Tasks main panel + sidebar entry; it reads through
# `workspaceFiles` and writes through the command Remote, so it needs no custom
# Typert namespace.
# ── project-state: the state core (ccProjectState) ────────────────────────────
# One host row that publishes the project state service: the single writer of state/ in a
# workspace. It owns the entity schema (REQ/DECISION/TASK/TEST) with YAML frontmatter and a
# body, typed sequential IDs allocated under a lock, links with the content hash of their
# target, compare-and-set TASK transitions, the append-only journal with replay, snapshot()
# and verify(). It registers NO model tool: the REQ/TASK operations, the views/ projections
# and the migrations are their own tasks and consume this service. It DOES register one command,
# `/state`, which is how the owner's hand edit in the State panel reaches the core: the payload
# carries the revision, the core writes with `origin: human` and marks the edited fields as the
# owner's own (`manualFields`), so a later mirror write leaves them alone until they are released.
- insert:
    - id: project-state
      name: '@cc/dsh-project-state'

# ── project-state-panel: four modes and an Edit tab over the state projections ─
# One client-only panel (the host row registers nothing) over `state/views/index.json`: the
# business requirements, the task board, the design map and tests/traceability share one
# selection, so picking a requirement filters the other modes. The map is designmap's page
# editor (Excalidraw on one page file), mounted full-height with a full-screen control; it is
# always editable and saves through the /designmap command. The panel writes no file; the
# owner has exactly two writes, both through the command Remote: a task status to the taskboard
# (`/taskboard owner-status`, because the board owns that row) and any field of a REQ/TASK/TEST
# to the state core (`/state`, which checks the revision and marks the field as the owner's). It
# reads `state/` and the analysis records through the read-only workspaceFiles API.
- insert:
    - id: project-state-panel
      name: '@cc/dsh-project-state-panel'

# ── state-feed: L1 once, L2 by hash ─────────────────────────────────────────
# Writes the project state into the CONVERSATION through agent.inject(): one L1 user message
# on a root session (digest + plan + last snapshot), then one aggregated L2 delta at a turn
# boundary only when the sha256 of digest+board+snapshot changed. A delegated worker and a
# workspace without state/ get nothing. The harness journals every injected message as
# user/message, so "model-visible means logged" needs no second mechanism.
- insert:
    - id: state-feed
      name: '@cc/dsh-state-feed'

- insert:
    - id: delegation-brief
      name: '@cc/dsh-delegation-brief'

- insert:
    - id: taskboard
      name: '@cc/dsh-taskboard'
      config:
        file: .dsh/taskboard.json
        # No cap on work in flight. `maxTasks: 0` is the plugin's explicit UNLIMITED, not a
        # default: this workspace runs many long-lived role rows at once and the 200 cap
        # turned "start one more task" into `board_full` with history on the board already
        # holding the answer.
        # NO ROW CAP EITHER. `maxRows` is deliberately absent: the plugin has no default limit,
        # and the shipped 1000-row guard refused new work in a real workspace whose board had
        # 1000 rows of history. A limit is a decision for the owner, not a default.
        maxTasks: 0
        timelineLimit: 120

# ── orchestrator: the root agent plans, delegates and integrates ─────────────
# Root-only policy section + root-only `delegate_task`; child-only specialist
# section. The taskboard service must be mounted first; `inject` waits for it.
# The delegation tool creates the task (or attaches an existing one with `taskId`),
# reuses a role from the ledger (a near-duplicate new role is refused unless
# `forceRole`), renders a self-contained brief, starts a flash child with
# `agentOptions`, and links the child id. A role re-created in a later chat carries
# its earlier results into the brief, because the specialist session does not
# survive the chat that spawned it.
- insert:
    - id: orchestrator
      name: '@cc/dsh-orchestrator'
      config:
        provider: spawn
        childProvider: deepseek-official
        childModel: deepseek-flash
        promptSections: true

# ── research-first: read the current source before you build ────────────────
# The silent failure is not wrong code but OUTDATED code: a library was renamed,
# a pattern superseded, and the agent writes last year's API because it compiles.
# A prompt rule loses to confidence, so this plugin observes the session's
# web_fetch/web_search results and refuses to CREATE a new file when nothing has
# been read yet. Editing existing files is never blocked — the code in front of
# you is the truth about itself. One lookup unlocks the session; research_waive
# exists for an offline machine and logs its reason.
- insert:
    - id: research-first
      name: '@cc/dsh-research-first'

# ── rtk: command-aware shell output, compressed where it enters the context ──
# The output half of RTK. Upstream rewrites the COMMAND through a Claude Code
# PreToolUse hook; this harness's `tools/pre-execute` cannot rewrite arguments at
# all, so the plugin listens on `tools/post-execute` instead: an oversized result
# from a recognised single command is piped through `rtk pipe -f <filter>` and the
# model-facing projection is replaced, with a banner that keeps the elision visible
# and names how to get the full text back. The binary is resolved from PATH and the
# per-user install locations, never from a baked-in path. Nothing here runs when
# rtk is absent: the prompt section says so and the listener no-ops.
- insert:
    - id: rtk
      name: '@cc/dsh-rtk'

# ── outline: a table of contents for a file, before the file is read ─────────
# Mounted at the HOST level, not inside a preset: a file outline is not a role's
# speciality, so the orchestrator and all seven presets inherit the tool and this
# section. code-skeleton-mcp parses the file (tree-sitter WASM grammars committed
# inside that package - no network, no native build) and returns symbols with
# line ranges, signatures and first-line docstrings instead of the body, so an
# unknown 2 000-line file costs one small result plus a `read` of the range that
# matters instead of the whole file on every later step. The binary is resolved
# from PATH and a configured `bin`; when neither answers, no tool is registered
# and the section says `outline unavailable` and where the plugin looked.
- insert:
    - id: outline
      name: '@cc/dsh-outline'

# ── run-code-projection: the bulk of a large tool result, moved out of the step ─
# A program that prints a report, a whole file or a whole page hands the model tens
# of kilobytes in one tool/result, and every later step re-sends them. This row
# listens on the same tools/post-execute seam RTK uses, but for a configured tool
# list: above 8 KiB the model-facing text becomes a banner, the first 3 KiB, the
# last 1.5 KiB and the exact path of the full text written INSIDE the session
# workspace, so the model reads the middle back with ordinary file tools only when
# it needs it. Compare-and-set tools (task_get, task_update, task_close,
# analysis_*, delegation_*) and skill stay whole: their text is a contract or
# instructions. Errors, media, short results, already-projected text and a result
# another policy replaced are never touched.
# 2026-11-18: the list was one tool (run_code); the first two steps of session
# session-0b50bf39 put 190 324 chars of task_list/read/hindsight output into the
# context and re-sent them for 54 requests. The list below is the fix.
- insert:
    - id: run-code-projection
      name: '@cc/dsh-run-code-projection'
      config:
        tools:
          - run_code
          - bash
          - pwsh
          - read
          - web_fetch
          - hindsight_read_page
          - hindsight_search_pages
          - grep
          - glob
          - outline
          - task_list

# ── skill-evolve: the skill library grows instead of rotting ────────────────
# The harness already discovers `<name>/SKILL.md` under $DSH_HOME/skills and
# re-reads a body on every load, so the missing half is discipline, not plumbing:
# write with a validated name and size, keep the previous body, refuse to
# overwrite a human's skill, and find the duplicates. That is SkillClaw's useful
# half without its proxy, its Python, or a second process. The model proposes the
# procedure; these tools enforce the rules.
- insert:
    - id: skill-evolve
      name: '@cc/dsh-skill-evolve'

# ── replace the subagent catalog with the taskboard ────────────────────────
# The taskboard's header cell reuses the `subagent-catalog` id; the shipped
# client package registers that id first and cannot share the cell. Disabling
# the client package removes the lineage popover (the window this deployment is
# replacing) while the host-side subagent tools, lifecycle and session child
# conversations remain. Child sessions are opened from the task detail.
- id: ui-subagent
  name: '@deepseek-ai/dsh-client-ui-subagent'
  disabled: true

# ── machine rows that were living ONLY in the installed profile ─────────────
# These two rows were appended to $DSH_HOME/profiles/web/cordis.patch.yml by hand
# on an earlier day and never came back to the kit. The kit's managed-seed rule
# reports a hand-edited profile patch and leaves it alone, so the kit and this
# machine had drifted and `kit-update --check` reported profile drift forever.
# Folding them in is the kit's own rule applied: the machine is a projection of
# the kit, so configuration worth keeping lives HERE, not in the installed copy.
#
# The welcome notice is pinned to the version the operator has already seen; it is
# a suppression marker, not a feature flag. The default model is the deployment's
# model policy (flash, High reasoning effort on the root agent and on every role) —
# the same choice flash-guard and model-gate assume, now stated once, portably.
# Owner, 2026-11-27: the default reasoning budget is High, not max, for the root and
# for every working preset; the architect keeps its own route at High (role-model).
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1

# The `web` bundle stopped declaring `searchProvider: deepseek-search-api` in 0.2.2-rc.5;
# a harness default is not a contract, so the kit states the route it relies on. Without
# this row an upgrade silently changes where the web search tools send their requests.
- id: web
  config:
    searchProvider: deepseek-search-api

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high

# ── retry: a malformed model answer must not end the turn ───────────────────
# The harness retries a failed model request at the agent step boundary, but
# `MALFORMED_RESPONSE` is only a CHOICE in the settings; the shipped policy
# retries EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT and TRANSPORT, so a stream
# whose tool-call JSON does not parse ("tool input is invalid JSON") throws and
# the whole turn dies - the human sees one failed turn and no work happens.
# That failure is raised at `message_stop`, BEFORE any tool runs: the adapter
# validates every tool-call block, discards the response, and the retry re-sends
# the same durable history, so no partial answer reaches the model or the log.
# `retryableCodes` REPLACES the default set - the five defaults are repeated on
# purpose. Five attempts per step is the harness default; each attempt is a
# billed request, which is why the mode stays bounded (`normal`), not `always`.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]

# ── kimi: the Kimi Code subscription as a second model provider ────────────
# `llm-pi-ai` is mounted dormant by dsh-base — zero routes until `providers`
# supplies one, then the route registers live and drops when the section empties.
# `kimi-coding` is the Kimi Code plan endpoint (OpenAI-compatible, models from
# https://api.kimi.com/coding/v1/models). The key is only ever a REFERENCE:
# `apiKeyEnv` resolves per request through the harness credential store, so the
# secret lives in $DSH_HOME/.credentials.yaml and never in this file.
#
# Two models, and only two, because the catalog IS the picker: every extra entry
# is a route someone reaches for without reading its rate. K3.1 Pro is the "smart"
# tier — planning, design, review, orchestration. `kimi-for-coding` (K2.8 Preview)
# is the workhorse that stands in for DeepSeek during its peak hours. Neither
# highspeed variant is listed: they cost two to three times the tokens for latency
# this work does not need, and flash-guard refuses them outright if anything names
# one anyway.
#
# Why an explicit `models` list at all: the pi-ai catalog installed with this dsh
# build predates the K3.1 family (it ships k3, k3-256k, kimi-for-coding and
# kimi-for-coding-highspeed only), and a `models` list REPLACES the route's
# catalog. Unset fields default from the installed model of the same id, so only
# k3.1-pro carries the k3 compatibility switches — no installed entry exists for
# it to inherit them from. Context windows come from the endpoint's own listing.
# K3.1 Pro is thinking-only and refuses a disabled-thinking request (HTTP 400),
# so `off` is absent from its effort map: the keys are what a selector may offer.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_CODING_API_KEY
        models:
          - id: k3.1-pro
            name: Kimi K3.1 Pro
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              supportsStrictMode: false
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              maxTokensField: max_tokens
              thinkingFormat: openai
              requiresReasoningContentOnAssistantMessages: true
          - id: kimi-for-coding
            name: Kimi K2.8 Preview
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
        # the same bounded retry as the DeepSeek route above, because a
        # malformed answer is a property of the model's output, not of the route
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]


      # The harness's own pi-ai catalog already ships this provider: baseUrl
      # https://chatgpt.com/backend-api, protocol openai-codex-responses, and an OAuth
      # grant named "OpenAI (ChatGPT Plus/Pro)" with isSubscription: true. Naming the
      # route here activates that catalog entry. The web Models page has no button for
      # this OAuth-only route, so the sign-in is started from chat by the codex-signin
      # plugin (codex_signin_start); the grant is stored as llm-pi-ai/openai-codex. No
      # API key and no prepaid credits are involved, so a ChatGPT subscription is enough.
      # The installed pi-ai catalog (1.5.2 in DSH 0.2.2-rc.3) stops at GPT-6.1: it has no
      # GPT-6.2 family, so the picker cannot offer the models this subscription serves. The
      # route accepts them (measured: POST /codex/responses with gpt-6.2-astra -> 200 and a
      # completed answer), and the live catalog
      # (GET /backend-api/codex/models?client_version=1.0.0) lists gpt-6.2-astra and
      # gpt-6.2-sol next to the 6.1/6/5.6 tiers. A `models` list REPLACES the route's catalog,
      # so the whole set is repeated: entries that exist in the installed catalog inherit
      # their capacities and compat flags; the two new ids carry their own.
      openai-codex:
        models:
          - id: gpt-6.2-astra
            name: GPT-6.2 Astra
            contextWindow: 272000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.2-sol
            name: GPT-6.2 Sol
            contextWindow: 272000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.1-sol
          - id: gpt-6.1-terra
          - id: gpt-6-astra
          - id: gpt-6-sol
          - id: gpt-6-luna
          - id: gpt-5.6-sol
          - id: gpt-5.6-terra
          - id: gpt-5.6-luna

# ── subagent model selection: which routes an agent may hand to a child ─────
# The harness's own gate for a model-facing child route: the `subagent` tool
# accepts `provider`/`model` only for a route listed here, `delegate_task` reads
# the same list through `childRouteFor()`, and the Plugins > Subagent page edits
# this namespace. Enabling it is what makes the Kimi tiers reachable for delegated
# work at all; without it a child request collapses to the configured flash route.
# Same three routes as flash-guard's `allowedRoutes`, on purpose: a route this
# list offers and the guard rewrites is a setting that lies to the operator.
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: kimi-coding
        model: k3.1-pro
      - provider: kimi-coding
        model: kimi-for-coding

# ── role-model: a role's own route, and a fallback when its quota is gone ───
# A preset has no model field (`PresetDefinition` is identity + plugins), so a role that must run
# on an expensive model was re-routed by hand in every session. This row is that rule, and the
# first entry is the ARCHITECT role: `openai-codex/gpt-6.2-sol` for a fresh session whose human
# has not picked a model (the owner moved it off `gpt-6.2-astra` on 2026-11-20), at High effort,
# and `deepseek-official/deepseek-flash` at High effort — the deployment default from
# `agent-default-model` above — when the provider answers QUOTA. The switch happens at
# `agent/request-error` and the step is RETRIED, so an exhausted subscription costs one retried
# step instead of a dead turn.
#
# THE WORKING PRESETS ARE PINNED TOO (owner, 2026-11-27). Every specialist preset names its route
# explicitly at High effort, so a chat started ON that preset and a delegated child of it get the
# same default instead of inheriting whatever the deployment row says (the installed row is
# machine-owned and kit-update keeps it verbatim: this machine carries `openai-codex/gpt-6.2-sol`
# at xhigh, which is right for the architect, not for a working role). A rule names the pair
# because role-model needs provider+model; it does not change what a human picked in the composer
# (`model/selection` recorded since load wins). `gpt-6.2-sol` is not in
# `subagent-model-selection-settings`, so no delegation or workflow script can name it.
- insert:
    - id: role-model
      name: '@cc/dsh-role-model'
      config:
        roles:
          architect:
            provider: openai-codex
            model: gpt-6.2-sol
            reasoningEffort: high
            fallback:
              provider: deepseek-official
              model: deepseek-flash
              reasoningEffort: high
          # The working presets: their own cheapest route, at High effort. One block per preset
          # because role-model keys by preset id; the route is the one delegation already uses.
          backend:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          devops:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          docs:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          ux:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          presenter:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          research:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          gatherer:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          reviewer:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          critic:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high
          tester:
            provider: deepseek-official
            model: deepseek-flash
            reasoningEffort: high

# ── codex-signin: ChatGPT Plus/Pro device login outside the GUI ─────────────
# The web build has no provider sign-in control for the OAuth-only openai-codex route;
# these three tools give the orchestrator the device-code flow from chat. The pi-ai
# authorization flow owns the grant write; the tools only surface URL, code and status.
- insert:
    - id: codex-signin
      name: '@cc/dsh-codex-signin'
      config:
        presets:
          - orchestrator

# ── roles: the nine compositions this deployment runs ──────────────────────
# A role is an agent preset, not a prompt request: the preset IS the tool list and
# the persona, so a backend specialist cannot run `papers_*` because nothing
# registered it, and the orchestrator cannot run a command because it has no `bash`
# tool at all (it does carry `write`/`edit`). Isolation that lives in a
# registration cannot be talked around by a brief that says "please don't".
#
# The orchestrator is the default preset: every new chat starts as the system
# designer, and implementation is delegated to a specialist with the tools for it.
# `standard` stays available in the picker as the hands-on escape hatch.
#
# Rows the kit mounts at the host (taskboard, skills, research-first, proof-guard,
# rtk, hindsight) stay common on purpose; the role-specific kit tools gate
# themselves by preset id (`agentPreset` on the session header).
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: orchestrator

- insert:
    # ── orchestrator: system designer, plans and delegates, never edits ──────
    - id: preset-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestrator
        name: Orchestrator
        description: System designer. Decides what should exist, shapes the task, writes and edits files itself, and delegates the work that needs a shell or a specialist's proof.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the orchestrator of this workspace and the project's system designer. You decide what should exist, what is worth building and how the parts fit, and you can create and edit files yourself. Work flows through the taskboard: open the task, choose the specialist whose tools fit it, delegate with a self-contained brief, then judge the result. Keep the system-design map current whenever the design changes. A specialist that reports an architectural problem is telling you the task needs a different shape - reshape it instead of pressing for the local fix.  Ask the human only for decisions that are theirs. Your tools: read, write and edit, file search, the task board, delegation, web research and the design-map tool. You have NO shell: you cannot run a build, a test, a linter, a migration or any command, so anything whose proof is a command's output (build, test, static analysis, structural diff, secret or dependency scan, link check, page extraction) still goes to the role that owns the binary - make the edit if the edit is the work, delegate the proof.

                Your result is the board, not your summary. Two ways it becomes false: closing a task on a child's word without reading the evidence it returned (the board then records a claim, not a result), and reshaping a design problem into a local patch because a patch is cheaper. The opposite failure is ceremony: delegating a read you could do in one call, or running the whole gate after every edit. State the acceptance condition in the brief, judge it once, and say what you did not verify.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # The orchestrator writes its own files. The work kept stalling on "this is a
          # two-line edit" that had to become a delegation; what the orchestrator still must
          # not do is RUN anything, so bash stays out of this preset (it never had it).
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Absolute budget ~500K where the window allows it, and never more than
                  # 80% of the window: a 1M window compacts at 524K (0.5), a 272K Codex
                  # window at 206K (0.8, capped by the 64K headroom). A flat 0.5 cut the
                  # 272K window at 136K and paid for a summarization call plus a cache reset
                  # mid-turn (session-0b50bf39, 2026-11-18).
                  thresholdRatio: 0.8
                  retainRatio: 0.08
                  modelPolicies:
                    - provider: deepseek-official
                      model: deepseek-flash
                      thresholdRatio: 0.5
                    # The 1M Kimi windows are the same absolute budget: 0.8 would spend 838K.
                    - provider: kimi-coding
                      model: k3.1-pro
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: kimi-for-coding
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: k3
                      thresholdRatio: 0.5
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # ── architect: the system designer on the expensive route, minimal ────────
    # WHY A NINTH PRESET AND NOT A SMALLER ORCHESTRATOR: this role is called rarely (the owner
    # opens a chat on it, or the orchestrator delegates an L0 design question) and every step is
    # paid at the most expensive route the deployment has. Its surface is therefore the decision
    # tools only: read a named file, inspect the design map, change the design map, delegate the
    # reading. No bash (a command is a specialist's proof), no web (RESEARCH owns external state),
    # no write/edit (the design is the map and the answer; the orchestrator writes the record),
    # and NO skill-filesystem/tool-skill: the skill catalog was 30 304 B of the 34 188 B of
    # reminders in a measured session, and `tool-skill` emits the catalog only together with its
    # own tool, so dropping the tool drops the catalog. The three Hindsight read tools stay: the
    # plugin injects its guide into every root regardless (measured 9 288 B), and a guide whose
    # tools are absent would cost a failed call on the expensive route.
    #
    # CONTEXT SUPPLY (the owner's two modes): as a ROOT the role delegates a GATHERER for
    # reconnaissance — `delegate_task` is registered on root agents only, so as a CHILD the role
    # reads what its brief gave it and names what is missing. That split is deliberate and is
    # stated in the persona.
    #
    # ROUTE: `role-model` above selects gpt-6.2-sol at High effort for this preset before the
    # first request and falls back to flash at High effort on a quota failure.
    - id: preset-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: architect
        name: Architect
        description: System designer on the expensive route. Decides what should exist and how the parts fit from the context it is given; records the design map and delegates the reading.
        order: 15
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the architect of this workspace: the system designer, running on the deployment's most expensive route. Every token of context is paid at that route, so spend it on the decision, not on reading. Read only what the question needs (read, grep, glob, outline on named files or a named subsystem) and never survey the repository; when the answer depends on the current architecture, delegate ONE GATHERER with delegate_task and use its cited report instead of reading the tree yourself. As a delegated specialist you cannot delegate: the context you were given is the context, and a missing fact is named in your answer rather than explored. Record a design change in the design map with map_edit: draw the whole scheme with the `diagram` op (nodes, edges, LR or TB), then run map_lint and repair what it names before you call the page done. Answer in one text: the decision, why it is the right one, which parts change, what would break. No transcript of your reading. You cannot edit code, run commands or change the task board — those belong to the roles that own them; search the web (web_search/web_fetch) when the decision needs a fact the repository cannot give, and delegate the proof. Make the edit if the edit is the work. Keep the answer short enough to act on: the decision and its reasons are the product.

                A design decision is checked against the system that exists: cite the `file:line` you decided from, or say which fact you are missing. False positive: a design that contradicts the code because it was designed from the brief alone. False negative: refusing to decide because context is incomplete — name the missing fact in one line, and decide what its two answers would change. A reading transcript on this route is cost, not evidence.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # The two web reads: a design decision cites the current source, and the source is
          # sometimes a page, not a file. Read-only, so the role stays the decision surface.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # Half of the 272K window (136K) instead of the deployment's 0.8: the route is the
              # expensive one, so the session must stay small, and the summary is written by flash
              # rather than by the expensive model. `summarizationProvider`/`summarizationModel`
              # are set as a pair; without them the LAST ROUTED TARGET would write the summary,
              # which is astra here.
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
                  summarizationProvider: deepseek-official
                  summarizationModel: deepseek-flash
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

