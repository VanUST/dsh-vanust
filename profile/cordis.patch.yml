# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── notify: ONE card when a CORE chat agent finishes or asks ─────────────────
# Root chats only. A child is filtered by any of its three marks - delegationDepth, a
# parentSession, or origin 'subagent' - because a `subagent` child can report depth 0 while
# still being somebody's helper.
#
# "Finished" means STAYED idle: after `running -> idle` the plugin waits `settleMs`, and a
# continuation that starts inside that window cancels the line. A goal-driven job posts a
# summary per round and starts the next round immediately; without this the human gets one
# popup per round instead of one when the job is actually done.
#
# The finished sessions share ONE card - a line each - replaced as sessions join it, and one
# dismissal clears them all. A popup per session is what made three chats cost three clicks.
# `user-questions/request` is the other seam: it is the waterfall the ask-user path calls
# before it waits, and its listener announces before calling next(), so the card is there
# while the human is being waited on.
#
# It spawns a detached notifier and can never touch a turn: no tool, no prompt section, no
# service. Linux uses a Tk overlay; Windows a TopMost WinForms form; macOS the desktop
# notification. Silence it with DSH_NOTIFY_DISABLED=1.
- insert:
    - id: notify
      name: '@cc/dsh-notify'
      config:
        minRunMs: 15000
        settleMs: 8000
        onFinish: true
        onQuestion: true
        dismissMs: 0

# ── image window: only the newest screenshots stay in the request ───────────
# The harness satisfies a route's image budget REACTIVELY: the adapter rejects the
# request, @deepseek-ai/dsh-compaction-image-offload then removes the OLDEST images
# and retries - a head rewrite, so the provider re-bills the whole context from there.
# Measured 2026-11-10 (session-1cb0708d, kimi-coding, 532K context, 95 pasted
# screenshots in 13 batches): 6 offloads re-billed 1,783,829 of 2,260,222 fresh
# tokens. This row makes the window a sliding one: the image that falls out is
# dropped as the new one arrives, so the rewrite sits at the tail (~440K projected
# for the same session instead of 1,783,829). keepImages: 1 suits screenshot
# reading; raise it when a task compares several images.
- insert:
    - id: image-window
      name: '@cc/dsh-image-window'
      config:
        keepImages: 1

# ── presentation: decks the agent renders, shown by the file preview ────────
# Contributes one tool, `presentation`, which turns a JSON deck spec into a
# standalone HTML file in the session workspace. There is no client half on
# purpose: the Sidebar document preview already renders `.html` in a script-
# enabled sandboxed frame, so the deck is its own viewer, and the very file the
# user previews is the one they export and print — preview, export and PDF cannot
# drift apart because they are the same document.
- insert:
    - id: presentation
      name: '@cc/dsh-presentation'

# ── diagrams: schemes the agent draws, shown by the file preview ────────────
# Contributes one tool, `diagram`, which turns a JSON diagram spec into a standalone
# HTML file whose SVG is inline. Four kinds over one contract — flow (flowcharts and
# algorithm illustrations), arch (layered system design), sequence and state — because a
# scheme is a description of relationships, not of coordinates: the agent supplies nodes
# and edges and the plugin computes every position.
#
# No client half, for the same reason presentation has none: the Sidebar document preview
# already renders `.html` in a script-enabled sandboxed frame, so the document is its own
# viewer and the file the user prints is the file the agent wrote. The layout engine is
# dependency-free on purpose — a vendored renderer would put megabytes into every diagram
# and a supply chain into the plugin.
- insert:
    - id: diagrams
      name: '@cc/dsh-diagrams'

# ── designmap: semantic YAML model → deterministic ELK scene → panel ───────
# The single design map. The 0.2.0 Excalidraw plugin was removed in this release; the
# React Flow view below is the shipped renderer.
# The model is two small YAML files (`designmap/model.yaml` for nodes/edges/groups,
# `designmap/views.yaml` for views); ELK layered layout with groups and fixed-side
# ports produces a deterministic scene JSON per view under `designmap/out/`. The agent
# reads and edits the living document through seven `designmap_*` host tools; the human
# sees the same scene in the read-only sidebar panel and edits only the visual layer
# (x/y/fill/stroke in `designmap/overlays.json`) through `/designmap op:'overlay'`.
# The panel reads scenes/index through the read-only workspaceFiles API; every write is
# the command's. SVG export is canonical, PNG is optional and needs an external
# converter; the vision loop is deliberately not shipped.
- insert:
    - id: designmap
      name: '@cc/dsh-designmap'
      config:
        dir: designmap
        presets:
          - orchestrator

# ── test-cases: observed test cases persisted in docs/cases/ ────────────────
# Eight schema-enforced host tools over a repo-tracked library: case_record,
# case_update (compare-and-set), case_verify (red-first evidence), case_list,
# case_get, case_supersede, case_deprecate and case_drift. The rule is "observe
# first, then persist - no speculative tests"; a documented-only case keeps its
# requirement and a named reason, and a changed surface file marks a case stale
# instead of deleting it. The orchestrator only gets the intake subset
# (record/list/get/drift), so it can capture a human requirement without ever
# claiming a verification it did not run.
- insert:
    - id: test-cases
      name: '@cc/dsh-test-cases'

# ── analysis: analysis before decomposition ────────────────────────────────
# One repo-tracked Analysis Record per initiative in docs/analysis/, with CAS on
# `expectedRev`, an atomic temp-file + rename and a semantic fingerprint. Four
# root-only tools (analysis_read / analysis_upsert / analysis_check /
# analysis_impact) keep the business outcome separate from the requested solution
# and trace each requirement through process -> component -> task -> evidence.
# `delegate_task` reads the service through ctx.get('analysis') (it is NOT in the
# orchestrator's inject, so an absent row keeps legacy delegation): L0 passes
# without a document, L1/L2 are refused analysis_required without a ready record
# and analysis_stale after an affected requirement or design-map change. The
# trace lives ONLY here; the taskboard keeps its schema and designMapRev is a
# reference into `designmap/manifest.json`, the file @cc/dsh-designmap advances on a
# semantic model change (the retired `design.excalidraw` scene is a rollback file and
# changes no longer move the revision).
- insert:
    - id: analysis
      name: '@cc/dsh-analysis'
      config:
        dir: docs/analysis
        designMapFile: designmap/manifest.json

# ── project-rules: one cached prompt section the human edits ─────────────────
# `.dsh/rules.md` becomes the `project:rules` section on every agent and subagent.
# The text is frozen per turn and the previous string is kept when the bytes do not
# change, so typing in the panel cannot invalidate the provider's cached prefix; a
# save only writes the file and the next turn's boundary picks it up. Empty file =
# no section. The panel reads through workspaceFiles and saves through the command.
- insert:
    - id: project-rules
      name: '@cc/dsh-project-rules'
      config:
        file: .dsh/rules.md

# ── subagent capacity: no two-child cap ────────────────────────────────────
# `@cc/dsh-work-modes` is NOT mounted. Its one job was a monotonic tools.guard()
# that refused the third `subagent` child of a session, and its default limit is
# 2 — the number the operator hit. Removing the cap is deliberate: the deployment
# would rather pay for breadth when it asks for it than have a guard decide that
# the third parallel read is one too many. The package and its tarball stay in
# the kit (inventory row `mounted: false`) so re-enabling it is one row, not a
# rebuild.
#
# What stops runaway fan-out instead is the harness's own pool, and its default
# is 8. Raising it here rather than leaving it at 8 is the point of the change:
# dropping a cap of 2 only to collide with a cap of 8 a week later would be the
# same surprise twice. The knobs are the subagent service's: `maxActiveSubagents`
# is the concurrent child count across one main agent, `maxDepth` is nesting and
# stays at the default 1 because deeper nesting is a different decision.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxActiveSubagents: 64

# ── godot-mcp: a declarative, transferable MCP server list ──────────────────
# The harness ships an MCP client bridge (`@deepseek-ai/dsh-mcp-client`), so this
# plugin speaks no MCP itself. It owns the three things the bridge does not do:
# the canonical server list, the resolution of the `uvx` launcher that the Godot
# AI bridge cannot start without, and the Godot project directory that bridge
# must be started in.
#
# Why a plugin and not a row in this file. A hand-written row here would carry a
# version pin that has to track the addon committed in the project, and the value
# of a spec is that the pin lives in one place that a check can compare. The row
# the loader actually reads is written into the harness HOME patch layer
# (`$DSH_HOME/cordis.patch.yml`, applied over every profile) by
# `scripts/dsh-mcp-sync.mjs`, which imports this plugin's own `buildRow`, so the
# spec format and the row shape cannot drift apart. The HOME layer is used rather
# than this profile layer because one row then serves every profile.
#
# The plugin needs no harness package: it reads one JSON file and contributes one
# system-prompt section that reports, per declared server, whether its launcher
# was found. Everything else - connecting, naming tools `mcp__<server>__<tool>`,
# reconnecting, projecting results - is the shipped bridge's job and is fixed by
# its own tests.
- insert:
    - id: godot-mcp
      name: '@cc/dsh-godot-mcp'

# ── skills: the deployment's reusable instructions ─────────────────────────
# Twenty runtime skills in one tarball: Ponytail's lazy-senior discipline,
# grill-me/grilling, Karpathy clear-writing/explain-webpage/explain-diagram
# (adapted to the local `diagram` tool), the UI builder loop, the proof-not-tests
# ruling, the literature-review procedure, and five added on 2026-10-26:
# tests-that-could-fail (a check must be able to fail), visual-explanations (one
# system across deck/diagram/page/animation), ui-testing (role-first, state
# matrix, negative run), ui-design-system (tokens, states, layout patterns), and
# research-first (read the current source before writing), and six added on
# 2026-11-09 for UX/UI testing: canvas-test-bridge (a gated window.__APP_TEST__),
# property-based-domain-tests (Vitest + fast-check), visual-golden-tests
# (pixelmatch + Argos), a11y-keyboard-audit (axe-core + keyboard walk),
# maestro-mobile-flows, and test-run-observability (JSONL events + traces). They register through
# `ctx.skills.register`, so the tarball is the source of truth and no machine
# needs a copy under $DSH_HOME/skills. `grill-me` stays user-invocable; the model
# reaches the procedure through `grilling`.
- insert:
    - id: skills
      name: '@cc/dsh-skills'

# ── papers: arXiv/HF search, trending, PDF text ────────────────────────────
# One host-only tool family for the literature-review skill. Public APIs, no key;
# results are normalised across arXiv and Hugging Face, and a source failure is
# reported while the other source still returns.
- insert:
    - id: papers
      name: '@cc/dsh-papers'

# ── flash-guard: delegated work stays on flash ─────────────────────────────
# The default model is already deepseek-flash, but a workflow script can name
# another route. This listener runs after `agent/request` resolves the frozen
# LlmCallConfig and rewrites a child's route to flash before dispatch; with
# `onViolation: refuse` it throws instead. `enforceRoot: false` keeps the human's
# own model choice intact. External providers do not route through this seam.
#
# Two rules, because they answer different questions. `allowedRoutes` says what a
# CHILD may run on, so a child may be routed to either Kimi tier deliberately
# rather than always collapsing to flash; `deniedModels` says what NOBODY may run
# on, root included, and a match is refused rather than rewritten. Highspeed
# variants are the deny case: they cost twice to three times the tokens for speed
# this work does not need, and a silent substitution would spend the budget the
# rule exists to protect. The Kimi model list in the `llm-pi-ai` row below already
# omits them, so the deny pattern is the second line of defence, not the only one.
- insert:
    - id: flash-guard
      name: '@cc/dsh-flash-guard'
      config:
        provider: deepseek-official
        model: deepseek-flash
        # Refuse, never rewrite: dsh freezes a child's route before `agent/request`, so a
        # plugin that returns a different provider/model/effort now throws inside the turn
        # (`dsh-agent-loop`: 'use agent.model.select() before step preparation'). The guard
        # keeps the policy and loses only the substitution.
        onViolation: refuse
        enforceRoot: false
        maxReasoningEffort: high
        allowedRoutes:
          - provider: deepseek-official
            model: deepseek-flash
          - provider: kimi-coding
            model: k3.1-pro
          - provider: kimi-coding
            model: kimi-for-coding
        deniedModels:
          - '*highspeed*'

# ── proof-guard: the no-autotest ruling at the write seam ───────────────────
# A `tools/pre-execute` waterfall on write/edit: a test path needs a PROOF
# header naming the production behavior and the failure it prevents. `mode: deny`
# is the default; `warn` is the trial mode. The guard reads an existing file so a
# legacy test is not trapped. This is friction, not proof: the skill and
# human review remain the real check.
- insert:
    - id: proof-guard
      name: '@cc/dsh-proof-guard'
      config:
        mode: deny

# ── tool-families: each preset gets only the tool families its job needs ────
# MCP tools are registered at the HOST by the bridge rows above, before a preset is chosen,
# so a preset cannot unregister them; the tools registry does have the seam
# (`tools.restrict`, agent-scoped, re-derives the visible schema set), and this row is it.
# Measured on a real BACKEND child (2026-11-13): of 114,989 B of tool schema, `mcp__godot__*`
# was 60,679 B (52.8%) and `mcp__playwright__*` 16,280 B (14.2%), every kit tool ~20%.
#
# Two kinds of denial, because they answer different questions:
#   deny        - this role never gets the family (the orchestrator does not drive browsers).
#   projectDeny - the family is a PROJECT bridge, so it is kept only where the project is:
#                 `mcp__godot__*` appears for a session whose cwd holds `project.godot`.
#                 Registering it per preset instead would spawn one MCP bridge per agent.
# `hindsight_*` is in no row on purpose: a memory tool a child can call is a capability, and
# the automatic recall/write-back stays root-only inside the plugin.
# `standard` (no preset) and any preset without a row keep their full surface.
# The restriction is applied at `agent/created` and retried once at the first `agent/pre-step`
# if the host layer had no names yet (both before that step's request header exists).
- insert:
    - id: tool-families
      name: '@cc/dsh-tool-families'
      config:
        projectMarkers:
          'mcp__godot__*': project.godot
        # ALLOW LIST (V1.1, 2026-11-17). Until this change the eight rows below named only
        # what to remove, so every new host tool (MCP bridge, Hindsight, outline, babysitter)
        # was handed to every role: measured headers 2026-11-17 were orchestrator 109 tools /
        # 99 227 B of schema, backend 56 / 42 454 B, and all 8 Hindsight tools (6 430 B) sat
        # in every child header although the child journals show 9 Hindsight calls in total.
        # A row with `allow` now describes the whole role surface: a tool that matches no
        # allow pattern is removed, whether it existed when the row was written or not.
        # Budgets: orchestrator <=40, backend <=16, reviewer <=14, critic <=14, gatherer
        # <=10, research <=14, docs <=14, ux <=40. A preset WITHOUT a row (standard, cordis,
        # ptc and any unknown preset) keeps its full surface - D8.
        # No row allows `mcp__godot__*` (it is ~30 tools / 60 KB and no eight-preset budget
        # holds it); `projectMarkers`+`projectDeny` stay supported for a row that needs a
        # family only on a project that can drive it.
        # CONTEXT BUDGETS (FR2, D13) live with the family policy: one owner for the role
        # surface and its size. `tools` is the declared allowance for the role as measured on
        # 2026-11-17; `recommended` is the design table (a count above it is a WARNING); a count
        # above 1.5 x `tools` is RED and fails `make verify`. Byte budgets are warnings; a PTC
        # session (at most two tools in its header) is measured against the mode's own baseline
        # (~53 KB system prompt), never against a native preset's 24-25 KB.
        budgets:
          orchestrator:
            tools: 54
            recommended: 40
            schemaBytes: 62000
            promptBytes: 26000
            remindersBytes: 70000
          ux:
            tools: 52
            recommended: 40
            schemaBytes: 60000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          backend:
            tools: 28
            recommended: 16
            schemaBytes: 45000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          reviewer:
            tools: 25
            recommended: 14
            schemaBytes: 43000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          critic:
            tools: 24
            recommended: 14
            schemaBytes: 40000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
          gatherer:
            tools: 16
            recommended: 10
            schemaBytes: 30000
            promptBytes: 26000
            remindersBytes: 70000
          research:
            tools: 23
            recommended: 14
            schemaBytes: 42000
            promptBytes: 26000
            remindersBytes: 70000
          docs:
            tools: 26
            recommended: 14
            schemaBytes: 45000
            promptBytes: 26000
            remindersBytes: 70000
            ptc:
              tools: 2
              promptBytes: 53365
        families:
          # Root: the board, delegation, the analysis record, the design map, files and the
          # read half of Hindsight (D4 keeps Hindsight at the root; the write tools are out).
          orchestrator:
            allow:
              - analysis_check
              - analysis_impact
              - analysis_read
              - analysis_upsert
              - ask_user_question
              - delegate_task
              - designmap_apply
              - designmap_open
              - designmap_render
              - designmap_scan
              - designmap_status
              - edit
              - glob
              - grep
              - hindsight_list_pages
              - hindsight_read_page
              - hindsight_search_pages
              - hindsight_reflect
              - outline
              - present
              - read
              - skill
              - skill_evolve
              - skill_inventory
              - task_cancel
              - task_close
              - task_create
              - task_get
              - task_link
              - task_list
              - task_note
              - task_pause
              - task_remove
              - task_resume
              - task_stop
              - task_update
              - todo_write
              - web_fetch
              - web_search
              - write
          # Implementation role: files, a shell, the two board tools a worker needs
          # (task_get/task_note), the case runner and the three intake case tools.
          backend:
            allow:
              - bash
              - case_get
              - case_list
              - case_record
              - case_run
              - case_suite
              - edit
              - glob
              - grep
              - job_output
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - write
          # Verification: read-only code access plus the case library; no write/edit (the
          # role contract), no shell beyond bash for the proof runs.
          reviewer:
            allow:
              - bash
              - case_gate
              - case_get
              - case_list
              - case_run
              - glob
              - grep
              - present
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - todo_write
          # Adversarial review: the same read-only surface plus background-job reading for
          # long negative runs.
          critic:
            allow:
              - bash
              - case_get
              - case_list
              - case_run
              - glob
              - grep
              - job_output
              - present
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - todo_write
          # Reconnaissance: the cheapest surface in the kit (<=10): read-only code search,
          # a shell, the two board tools and skills.
          gatherer:
            allow:
              - bash
              - glob
              - grep
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - todo_write
              - working_directory
          # Research: web and paper search, files, no shell (it reads and writes reports).
          research:
            allow:
              - glob
              - grep
              - papers_download
              - papers_search
              - papers_trending
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - todo_write
              - web_fetch
              - web_search
              - write
          # Documentation: write/edit plus web verification of links and the case intake.
          docs:
            allow:
              - case_get
              - case_list
              - case_record
              - edit
              - glob
              - grep
              - read
              - skill
              - task_get
              - task_note
              - todo_write
              - web_fetch
              - web_search
              - write
          # Interface work: the ONLY preset that keeps the Playwright family (24 tools /
          # 16 305 B, probe 5) - the role exists to render a UI. No godot, no Hindsight.
          ux:
            allow:
              - bash
              - case_list
              - case_record
              - edit
              - glob
              - grep
              - mcp__playwright__*
              - present
              - read
              - read_image
              - skill
              - task_get
              - task_note
              - todo_write
              - web_fetch
              - web_search
              - write


# ── taskboard: the workspace task ledger ───────────────────────────────────
# One `.dsh/taskboard.json` per workspace, with objective, scope, non-scope,
# acceptance, status, results and a timeline. Model tools and the `/taskboard`
# command share one service. The client half replaces the `subagent-catalog`
# header cell and adds a Tasks main panel + sidebar entry; it reads through
# `workspaceFiles` and writes through the command Remote, so it needs no custom
# Typert namespace.
# ── project-state: the state core (ccProjectState) ────────────────────────────
# One host row that publishes the project state service: the single writer of state/ in a
# workspace. It owns the entity schema (REQ/DECISION/TASK/TEST) with YAML frontmatter and a
# body, typed sequential IDs allocated under a lock, links with the content hash of their
# target, compare-and-set TASK transitions, the append-only journal with replay, snapshot()
# and verify(). It registers NO model tool: the REQ/TASK operations, the views/ projections
# and the migrations are their own tasks and consume this service.
- insert:
    - id: project-state
      name: '@cc/dsh-project-state'

- insert:
    - id: taskboard
      name: '@cc/dsh-taskboard'
      config:
        file: .dsh/taskboard.json
        # No cap on work in flight. `maxTasks: 0` is the plugin's explicit UNLIMITED, not a
        # default: this workspace runs many long-lived role rows at once and the 200 cap
        # turned "start one more task" into `board_full` with history on the board already
        # holding the answer. The file guard below is what still bounds the ledger.
        maxTasks: 0
        maxRows: 1000
        timelineLimit: 120

# ── orchestrator: the root agent plans, delegates and integrates ─────────────
# Root-only policy section + root-only `delegate_task`; child-only specialist
# section. The taskboard service must be mounted first; `inject` waits for it.
# The delegation tool creates the task (or attaches an existing one with `taskId`),
# reuses a role from the ledger (a near-duplicate new role is refused unless
# `forceRole`), renders a self-contained brief, starts a flash child with
# `agentOptions`, and links the child id. A role re-created in a later chat carries
# its earlier results into the brief, because the specialist session does not
# survive the chat that spawned it.
- insert:
    - id: orchestrator
      name: '@cc/dsh-orchestrator'
      config:
        provider: spawn
        childProvider: deepseek-official
        childModel: deepseek-flash
        promptSections: true

# ── research-first: read the current source before you build ────────────────
# The silent failure is not wrong code but OUTDATED code: a library was renamed,
# a pattern superseded, and the agent writes last year's API because it compiles.
# A prompt rule loses to confidence, so this plugin observes the session's
# web_fetch/web_search results and refuses to CREATE a new file when nothing has
# been read yet. Editing existing files is never blocked — the code in front of
# you is the truth about itself. One lookup unlocks the session; research_waive
# exists for an offline machine and logs its reason.
- insert:
    - id: research-first
      name: '@cc/dsh-research-first'

# ── rtk: command-aware shell output, compressed where it enters the context ──
# The output half of RTK. Upstream rewrites the COMMAND through a Claude Code
# PreToolUse hook; this harness's `tools/pre-execute` cannot rewrite arguments at
# all, so the plugin listens on `tools/post-execute` instead: an oversized result
# from a recognised single command is piped through `rtk pipe -f <filter>` and the
# model-facing projection is replaced, with a banner that keeps the elision visible
# and names how to get the full text back. The binary is resolved from PATH and the
# per-user install locations, never from a baked-in path. Nothing here runs when
# rtk is absent: the prompt section says so and the listener no-ops.
- insert:
    - id: rtk
      name: '@cc/dsh-rtk'

# ── outline: a table of contents for a file, before the file is read ─────────
# Mounted at the HOST level, not inside a preset: a file outline is not a role's
# speciality, so the orchestrator and all seven presets inherit the tool and this
# section. code-skeleton-mcp parses the file (tree-sitter WASM grammars committed
# inside that package - no network, no native build) and returns symbols with
# line ranges, signatures and first-line docstrings instead of the body, so an
# unknown 2 000-line file costs one small result plus a `read` of the range that
# matters instead of the whole file on every later step. The binary is resolved
# from PATH and a configured `bin`; when neither answers, no tool is registered
# and the section says `outline unavailable` and where the plugin looked.
- insert:
    - id: outline
      name: '@cc/dsh-outline'

# ── session-budget: a deterministic handoff reminder at step thresholds ─────
# A long session is not a failure, it is expensive: every step re-sends the whole
# derived history and compaction re-bills the prefix. The fix is a HANDOFF note
# written while the context is still affordable, not a summary written after it is
# not. This row counts completed steps from the append-only log through a session
# projection, so a compaction's surface rewrite neither resets the count nor
# erases which thresholds already fired, and it appends ONE fixed user/message
# before the step that crosses 300/400/500 - in the same request, because the
# pre-step waterfall runs before the request is derived. The human gets one
# detached desktop notification per crossing through @cc/dsh-notify/core. No model
# call, no daemon: a failure is logged once and never thrown into the turn.
- insert:
    - id: session-budget
      name: '@cc/dsh-session-budget'

# ── run-code-projection: the bulk of a run_code result, moved out of the step ─
# The tool that dominates this deployment's context is not bash but run_code: a
# program that prints a report or a whole file hands the model tens of kilobytes
# in one tool/result, and every later step re-sends them. This row listens on the
# same tools/post-execute seam RTK uses, but for run_code: above 8 KiB the
# model-facing text becomes a banner, the first 3 KiB, the last 1.5 KiB and the
# exact path of the full text written INSIDE the session workspace, so the model
# reads the middle back with ordinary file tools only when it needs it. Errors,
# media, short results, already-projected text and a result another policy
# replaced are never touched, and the banner always names the elided byte count.
# Measured over this workspace's session logs with the same policy: 5.56% of all
# tool-result bytes saved, which is the 5-7% the projection was designed for.
- insert:
    - id: run-code-projection
      name: '@cc/dsh-run-code-projection'

# ── skill-evolve: the skill library grows instead of rotting ────────────────
# The harness already discovers `<name>/SKILL.md` under $DSH_HOME/skills and
# re-reads a body on every load, so the missing half is discipline, not plumbing:
# write with a validated name and size, keep the previous body, refuse to
# overwrite a human's skill, and find the duplicates. That is SkillClaw's useful
# half without its proxy, its Python, or a second process. The model proposes the
# procedure; these tools enforce the rules.
- insert:
    - id: skill-evolve
      name: '@cc/dsh-skill-evolve'

# ── replace the subagent catalog with the taskboard ────────────────────────
# The taskboard's header cell reuses the `subagent-catalog` id; the shipped
# client package registers that id first and cannot share the cell. Disabling
# the client package removes the lineage popover (the window this deployment is
# replacing) while the host-side subagent tools, lifecycle and session child
# conversations remain. Child sessions are opened from the task detail.
- id: ui-subagent
  name: '@deepseek-ai/dsh-client-ui-subagent'
  disabled: true

# ── machine rows that were living ONLY in the installed profile ─────────────
# These two rows were appended to $DSH_HOME/profiles/web/cordis.patch.yml by hand
# on an earlier day and never came back to the kit. The kit's managed-seed rule
# reports a hand-edited profile patch and leaves it alone, so the kit and this
# machine had drifted and `kit-update --check` reported profile drift forever.
# Folding them in is the kit's own rule applied: the machine is a projection of
# the kit, so configuration worth keeping lives HERE, not in the installed copy.
#
# The welcome notice is pinned to the version the operator has already seen; it is
# a suppression marker, not a feature flag. The default model is the deployment's
# model policy (flash, maximum reasoning effort on the root agent) — the same
# choice flash-guard and model-gate assume, now stated once, portably.
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max

# ── retry: a malformed model answer must not end the turn ───────────────────
# The harness retries a failed model request at the agent step boundary, but
# `MALFORMED_RESPONSE` is only a CHOICE in the settings; the shipped policy
# retries EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT and TRANSPORT, so a stream
# whose tool-call JSON does not parse ("tool input is invalid JSON") throws and
# the whole turn dies - the human sees one failed turn and no work happens.
# That failure is raised at `message_stop`, BEFORE any tool runs: the adapter
# validates every tool-call block, discards the response, and the retry re-sends
# the same durable history, so no partial answer reaches the model or the log.
# `retryableCodes` REPLACES the default set - the five defaults are repeated on
# purpose. Five attempts per step is the harness default; each attempt is a
# billed request, which is why the mode stays bounded (`normal`), not `always`.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]

# ── kimi: the Kimi Code subscription as a second model provider ────────────
# `llm-pi-ai` is mounted dormant by dsh-base — zero routes until `providers`
# supplies one, then the route registers live and drops when the section empties.
# `kimi-coding` is the Kimi Code plan endpoint (OpenAI-compatible, models from
# https://api.kimi.com/coding/v1/models). The key is only ever a REFERENCE:
# `apiKeyEnv` resolves per request through the harness credential store, so the
# secret lives in $DSH_HOME/.credentials.yaml and never in this file.
#
# Two models, and only two, because the catalog IS the picker: every extra entry
# is a route someone reaches for without reading its rate. K3.1 Pro is the "smart"
# tier — planning, design, review, orchestration. `kimi-for-coding` (K2.8 Preview)
# is the workhorse that stands in for DeepSeek during its peak hours. Neither
# highspeed variant is listed: they cost two to three times the tokens for latency
# this work does not need, and flash-guard refuses them outright if anything names
# one anyway.
#
# Why an explicit `models` list at all: the pi-ai catalog installed with this dsh
# build predates the K3.1 family (it ships k3, k3-256k, kimi-for-coding and
# kimi-for-coding-highspeed only), and a `models` list REPLACES the route's
# catalog. Unset fields default from the installed model of the same id, so only
# k3.1-pro carries the k3 compatibility switches — no installed entry exists for
# it to inherit them from. Context windows come from the endpoint's own listing.
# K3.1 Pro is thinking-only and refuses a disabled-thinking request (HTTP 400),
# so `off` is absent from its effort map: the keys are what a selector may offer.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_CODING_API_KEY
        models:
          - id: k3.1-pro
            name: Kimi K3.1 Pro
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              supportsStrictMode: false
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              maxTokensField: max_tokens
              thinkingFormat: openai
              requiresReasoningContentOnAssistantMessages: true
          - id: kimi-for-coding
            name: Kimi K2.8 Preview
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
        # the same bounded retry as the DeepSeek route above, because a
        # malformed answer is a property of the model's output, not of the route
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]

# ── subagent model selection: which routes an agent may hand to a child ─────
# The harness's own gate for a model-facing child route: the `subagent` tool
# accepts `provider`/`model` only for a route listed here, `delegate_task` reads
# the same list through `childRouteFor()`, and the Plugins > Subagent page edits
# this namespace. Enabling it is what makes the Kimi tiers reachable for delegated
# work at all; without it a child request collapses to the configured flash route.
# Same three routes as flash-guard's `allowedRoutes`, on purpose: a route this
# list offers and the guard rewrites is a setting that lies to the operator.
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: kimi-coding
        model: k3.1-pro
      - provider: kimi-coding
        model: kimi-for-coding
# ── roles: the eight compositions this deployment runs ─────────────────────
# A role is an agent preset, not a prompt request: the preset IS the tool list and
# the persona, so a backend specialist cannot run `papers_*` because nothing
# registered it, and the orchestrator cannot run a command because it has no `bash`
# tool at all (it does carry `write`/`edit`). Isolation that lives in a
# registration cannot be talked around by a brief that says "please don't".
#
# The orchestrator is the default preset: every new chat starts as the system
# designer, and implementation is delegated to a specialist with the tools for it.
# `standard` stays available in the picker as the hands-on escape hatch.
#
# Rows the kit mounts at the host (taskboard, skills, research-first, proof-guard,
# rtk, hindsight) stay common on purpose; the role-specific kit tools gate
# themselves by preset id (`agentPreset` on the session header).
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: orchestrator

- insert:
    # ── orchestrator: system designer, plans and delegates, never edits ──────
    - id: preset-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestrator
        name: Orchestrator
        description: System designer. Decides what should exist, shapes the task, writes and edits files itself, and delegates the work that needs a shell or a specialist's proof.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the orchestrator of this workspace and the project's system designer. You decide what should exist, what is worth building and how the parts fit, and you can create and edit files yourself. Work flows through the taskboard: open the task, choose the specialist whose tools fit it, delegate with a self-contained brief, then judge the result. Keep the system-design map current whenever the design changes. A specialist that reports an architectural problem is telling you the task needs a different shape - reshape it instead of pressing for the local fix.  Ask the human only for decisions that are theirs. Your tools: read, write and edit, file search, the task board, delegation, web research and the design-map tool. You have NO shell: you cannot run a build, a test, a linter, a migration or any command, so anything whose proof is a command's output (build, test, static analysis, structural diff, secret or dependency scan, link check, page extraction) still goes to the role that owns the binary - make the edit if the edit is the work, delegate the proof.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # The orchestrator writes its own files. The work kept stalling on "this is a
          # two-line edit" that had to become a delegation; what the orchestrator still must
          # not do is RUN anything, so bash stays out of this preset (it never had it).
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # ── ux: designer and tester, reference-first, proves in a browser ────────
    - id: preset-ux
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ux
        name: UX/UI
        description: Designs and tests interfaces against references; proves every state in a real browser.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the UX/UI designer and tester for this workspace. Start by looking at how the best existing interfaces solve this (reference research with web_search/web_fetch) and reuse an existing pattern or component before inventing one. Build and prove in a real browser with Playwright: render, snapshot, screenshot, keyboard and screen-reader path, console and network.  Accessibility and legibility are part of done, not polish. Report what you verified and what you could not. Your tools: bash, the Playwright MCP browser, and the kit's pinned .tools libraries for accessibility audits (axe-core with playwright-core) and screenshot diffs (pixelmatch), run with node from <kit>/.tools.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # PTC: the ux role opens pages, snapshots them and reads the console as one
          # program, so the intermediate snapshots stay out of the conversation.
          # Scope is this preset only; removing this row is the rollback.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── backend: patterns and callers first, no ad-hoc patches ───────────────
    - id: preset-backend
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: backend
        name: Backend
        description: Writes and fixes the core code with the design in view; reports architectural problems instead of patching symptoms.
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the backend engineer for this workspace. Read the callers and the design before you change behavior; take the smallest complete change and reuse what exists. A bug is a question about the design: name the assumption that is wrong and fix the cause, not the symptom. When the honest fix is architectural, stop and report it to the orchestrator with the evidence and the alternatives instead of forcing an ad-hoc patch.  Prove with the product running, not with new tests. Your tools: bash plus the pinned `depcruise` (architecture rules, cycles, orphans), `semgrep` (pattern-based static analysis) and `oasdiff` (OpenAPI breaking-change gate), all installed by scripts/provision-tools.mjs.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # PTC: the backend runs a change and reads its diff as one program, so the
          # intermediate output stays in the program instead of the conversation.
          # Scope is this preset only; removing this row is the rollback.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── research: find what exists, read the source, cite it, never implement ─
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        name: Research
        description: Finds existing solutions and papers, reads the source, and returns a cited shortlist. No implementation.
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the researcher for this workspace. Your job is to harness a problem: find the existing solutions, papers and implementations, compare them, and say what is actually known. Read the source, not only the description; fetch every link you cite. Deliver a short ranked answer with URLs and the trade-offs, and say plainly what you could not verify.  You do not implement: no product code changes. Your tools: web_search/web_fetch, the papers tools and read-only repository search; you have NO shell, so text extraction (trafilatura), static analysis and scans are capabilities you must ask a shell-bearing role to run.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # No shell: research reads the repository through read/grep/glob and the web.
          # New notes and reports are allowed; surgical edits to existing files are not.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # ── gatherer: read the current system, return one cited report ───────────
    # The orchestrator's reconnaissance child. "How does this actually work today?"
    # used to be answered by the ROOT's own read/grep calls: the answers filled the
    # window the design decision needed, and the next design step still started from
    # a guess. This preset moves those calls into a child and returns one report the
    # orchestrator can design from. Read-only by construction: no write, no edit, so a
    # report cannot turn into a patch. bash stays because `git log`, `rg` and `wc` are
    # how an architecture is actually measured (a shell can still write - see
    # DEPLOYMENT 1.0 for the same caveat on reviewer/critic); there is no web: current
    # external state is RESEARCH's job, and this role describes THIS repository.
    - id: preset-gatherer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gatherer
        name: Context gatherer
        description: Reads the current architecture, algorithm and decisions and returns one cited report for the orchestrator to design from. Read-only; never edits and never delegates.
        order: 45
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the context gatherer for this workspace. Your job is to replace a guess with a reading: describe the CURRENT architecture and algorithm of the part you were asked about, so the orchestrator can design against it without spending its own context on reconnaissance. Read the code, the design map, the decision records and the git history that bear on the question. Answer the question that was asked, not the one you find more interesting, and cover: the entry point and the call path, who owns which state and which component is allowed to change it, the data flow in and out, the invariants the code actually enforces, where a change of the stated kind would land, and what would break. Cite `file:line` for every claim, and keep what you SAW in the code apart from what you INFER. Run read-only commands only (`git log`, `rg`, `wc`, `ls`): you have no write or edit tool, so a report cannot turn into a patch, and you never modify the workspace or its data. When the repository cannot answer the question, name the missing file, document or decision instead of inventing the design. Return one compact report, not a transcript of your reading: the tool calls stay in your context, the conclusions go back.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # PTC: one program instead of one step per tool call. The host mounts the
          # runtime; this row selects the PTC executor for the gatherer only, so the
          # role can read many files and return one report. Removing this row is the
          # rollback; the other presets keep the native executor.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── reviewer: independent, runs the change, edits nothing ────────────────
    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer
        name: Reviewer
        description: Reviews against the requirement and the design; runs the change, reports defects with evidence, edits nothing.
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the independent reviewer for this workspace. Review the change against the requirement and the design, not the author's summary. Run it, read the diff and the callers, and look for the defect that will bite: a wrong owner, a value derived twice, a missing case, a contract the caller never agreed to. Report severities with file:line and a reproduction.  Do not edit code; the orchestrator routes fixes. Your tools: bash plus the pinned `difft` (syntax-aware structural diff), `betterleaks` (secrets) and `osv-scanner` (dependency vulnerabilities), all installed by scripts/provision-tools.mjs.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # A reviewer reads and runs; it does not write.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # PTC: the reviewer runs a change and reads its diff as one program, so the
          # intermediate reads stay out of the conversation. Scope is this preset
          # only; removing this row is the rollback.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── critic: the adversary, not the fixer, not the UI tester ──────────────
    # The seventh role exists because "make sure it works" and "try to break it" are
    # different jobs. The reviewer judges a DIFF; UX/UI tests an INTERFACE; the critic
    # attacks a RUNNING algorithm or service with realistic inputs and sequences, on a
    # disposable copy, and reports the smallest failing case. It never fixes: a critic
    # that patches what it broke loses the finding and the independence.
    - id: preset-critic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: critic
        name: Critic
        description: Adversarial general tester. Breaks a running algorithm or service within the brief's constraints and reports reproducible failures; never fixes, never touches production data.
        order: 55
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the adversarial tester for this workspace. Your job is to BREAK the thing you were given: find realistic, non-trivial inputs and sequences that crash it, hang it, corrupt its state or make it return a wrong answer. Attack the algorithm or the service inside the brief's constraints - the interface is UX/UI's job and a diff is the reviewer's. Work on a disposable copy: /tmp, a scratch checkout, a copy of the data. Never modify product code and never touch production data or a live service someone else is using. Prefer an input a real user or producer could send - an empty or huge file, a boundary or off-by-one value, a duplicated or out-of-order event, a restart mid-write, a locale or encoding surprise, two operations that are fine alone and wrong together - over a synthetic absurdity that proves nothing. Every finding must be reproducible by someone who was not there: the exact command, the fixture, the observed output or exit code, and the SMALLEST input that still fails. When you cannot break it, say what you tried, how, and what remains untested; a clean report with its limits is a result, not a failure. You never fix anything: no edit to product code, no patch, no "while I was here". Report to the orchestrator with severity, reproduction and the smallest failing case.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # The 'never fix' persona is a tool surface here: no write and no edit, so a
          # finding cannot turn into a patch. bash stays for fixtures, and a shell can
          # still write - the critic is a reporter, not a jail (see DEPLOYMENT §1.0).
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # PTC: the critic attacks a running service with sequences of probes, which is one
          # program rather than one step per call. Scope is this preset only; removing it
          # is the rollback.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

