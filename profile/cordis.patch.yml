            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # The 'never fix' persona is a tool surface here: no write and no edit, so a
          # finding cannot turn into a patch. bash stays for fixtures, and a shell can
          # still write - the critic is a reporter, not a jail (see DEPLOYMENT §1.0).
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Absolute budget ~500K where the window allows it, and never more than
                  # 80% of the window: a 1M window compacts at 524K (0.5), a 272K Codex
                  # window at 206K (0.8, capped by the 64K headroom). A flat 0.5 cut the
                  # 272K window at 136K and paid for a summarization call plus a cache reset
                  # mid-turn (session-0b50bf39, 2026-11-18).
                  thresholdRatio: 0.8
                  retainRatio: 0.08
                  modelPolicies:
                    - provider: deepseek-official
                      model: deepseek-flash
                      thresholdRatio: 0.5
                    # The 1M Kimi windows are the same absolute budget: 0.8 would spend 838K.
                    - provider: kimi-coding
                      model: k3.1-pro
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: kimi-for-coding
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: k3
                      thresholdRatio: 0.5
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # PTC: the critic attacks a running service with sequences of probes, which is one
          # program rather than one step per call. Scope is this preset only; removing it
          # is the rollback.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── docs: stop document sprawl, do not feed it ───────────────────────────
    - id: preset-docs
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: docs
        name: Docs
        description: "Steward of documentation - prunes and corrects instead of adding, prefers inline docs, checks links and commands."
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the documentation steward for this workspace. Documentation is a liability unless it is true and findable: prefer inline comments and the code itself, delete or rewrite stale pages instead of adding another, and keep one source of truth per fact. Check links and commands you touch. Write an ADR only for a decision that constrains future work, and  refuse to produce documents nobody will read. Your tools: bash and the pinned `lychee` link/anchor checker (`--offline` keeps a run hermetic); the kit's own doc gate is `make verify`.

                Documentation is either true or a liability. False positive: a new page nobody will read, a restatement of the code, or a command in the doc that nobody ran. False negative: refusing to record a decision that constrains future work. Prefer the smallest correction to the one place that already owns the fact, and run every command and check every link you touch.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Absolute budget ~500K where the window allows it, and never more than
                  # 80% of the window: a 1M window compacts at 524K (0.5), a 272K Codex
                  # window at 206K (0.8, capped by the 64K headroom). A flat 0.5 cut the
                  # 272K window at 136K and paid for a summarization call plus a cache reset
                  # mid-turn (session-0b50bf39, 2026-11-18).
                  thresholdRatio: 0.8
                  retainRatio: 0.08
                  modelPolicies:
                    - provider: deepseek-official
                      model: deepseek-flash
                      thresholdRatio: 0.5
                    # The 1M Kimi windows are the same absolute budget: 0.8 would spend 838K.
                    - provider: kimi-coding
                      model: k3.1-pro
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: kimi-for-coding
                      thresholdRatio: 0.5
                    - provider: kimi-coding
                      model: k3
                      thresholdRatio: 0.5
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
