            name: '@deepseek-ai/dsh-tool-executor-ptc'

    # ── devops: owns the running deployment; one live task at a time ────────
    # The runtime is a shared resource, not a tool: a restart ends every child
    # working against it, and a version switch changes the thing another task is
    # still measuring. This preset is the seat that owns that lane. It has a shell
    # (the commands ARE the work), background jobs (a deployment is long), the file
    # tools (compose files, start scripts, env), web for release notes and registries,
    # and the case tools to cite and run an acceptance case the tester wrote. It has
    # no PTC (a deployment is read step by step, not diffed as one program) and no
    # present (its report is a command's output, not an artefact). It is NOT in
    # `store.mjs` readOnly: it writes config, so an L1/L2 delegation needs the
    # Analysis Record like any other.
    - id: preset-devops
      name: '@deepseek-ai/dsh-agent-preset'
      config:
