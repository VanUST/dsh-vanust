    # ── critic: the adversary, not the fixer, not the UI tester ──────────────
    # The seventh role exists because "make sure it works" and "try to break it" are
    # different jobs. The reviewer judges a DIFF; UX/UI tests an INTERFACE; the critic
    # attacks a RUNNING algorithm or service with realistic inputs and sequences, on a
    # disposable copy, and reports the smallest failing case. It never fixes: a critic
    # that patches what it broke loses the finding and the independence.
    - id: preset-critic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: critic
        name: Critic
        description: Adversarial general tester. Breaks a running algorithm or service within the brief's constraints and reports reproducible failures; never fixes, never touches production data.
        order: 55
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the adversarial tester for this workspace. Your job is to BREAK the thing you were given: find realistic, non-trivial inputs and sequences that crash it, hang it, corrupt its state or make it return a wrong answer. Attack the algorithm or the service inside the brief's constraints - the interface is UX/UI's job and a diff is the reviewer's. Work on a disposable copy: /tmp, a scratch checkout, a copy of the data. Never modify product code and never touch production data or a live service someone else is using. Prefer an input a real user or producer could send - an empty or huge file, a boundary or off-by-one value, a duplicated or out-of-order event, a restart mid-write, a locale or encoding surprise, two operations that are fine alone and wrong together - over a synthetic absurdity that proves nothing. Every finding must be reproducible by someone who was not there: the exact command, the fixture, the observed output or exit code, and the SMALLEST input that still fails. When you cannot break it, say what you tried, how, and what remains untested; a clean report with its limits is a result, not a failure. You never fix anything: no edit to product code, no patch, no "while I was here". Report to the orchestrator with severity, reproduction and the smallest failing case.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # The 'never fix' persona is a tool surface here: no write and no edit, so a
          # finding cannot turn into a patch. bash stays for fixtures, and a shell can
          # still write - the critic is a reporter, not a jail (see DEPLOYMENT §1.0).
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

