# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── mandatory rules: the kit's own rules, never a project's ─────────────────
# The harness ships a workspace-instruction loader that injects every AGENTS.md
# and CLAUDE.md from the project root down to the working directory, frames them
# as guidance ("may be relevant to your work"), and lets the most specific file
# win. That is the wrong shape for this deployment: cost policy, remote-change
# permission and verification duties must not be dilutable by whichever
# repository the agent happens to sit in, and the framing must read as binding.
#
# So that loader is neutered and the kit's rules are contributed to the system
# prompt directly instead. The section's text is a provider, re-evaluated on
# every prompt assembly, so editing $DSH_HOME/AGENTS.md takes effect on the next
# request without a restart. The plugin reads exactly one file, and no project
# instruction file can reach the prompt at all.
#
# WHY THERE IS NO `disabled: true` HERE, although the kit shipped one for months.
# Measured: a live web profile still injected a repository's AGENTS.md into fresh
# sessions, with this row shown as `disabled: true` in `--dump-config`, on a server
# booted after this file was written — while a scratch composition from the same
# patch honoured the flag. And `--dump-config` shows that patch `config` merges for
# an ENABLED row (see `llm-deepseek` below) but not for a disabled one, so a flag
# that is ignored on some composition also blocks the fix that would work.
#
# Emptying the discovery is the route that does not depend on the flag: with no
# candidate filenames the loader has nothing to find, whatever it is handed. The
# cost is one sentence in the prompt — its own "no workspace instructions are
# currently active" baseline — which carries no repository content. The live
# confirmation is asking a session what it received.
- id: agent-instructions
  config:
    instructionFileCandidates: []
    localInstructionFileCandidates: []
- insert:
    - id: kit-rules
      name: '@cc/dsh-kit-rules'

# ── model-gate: cost policy for the official DeepSeek route ────────────────
# Class-based flash-only gate: every llm/stream dispatch whose model is not a
# Flash-tier id is vetoed before the adapter is invoked (root turns,
# subagents, compaction, session titles), so a non-Flash model costs nothing
# and fails loudly. The pattern admits future Flash releases without a policy
# edit; non-Flash tiers (the pro line) match nothing.
- insert:
    - id: model-gate
      name: '@deepseek-ai/dsh-model-gate'
      config:
        enabled: true
        allowedModelPatterns:
          - '^deepseek-(v[0-9.]+-)?flash(-[a-z0-9-]+)*$'

# ── model picker: advertise only the current Flash model ───────────────────
# The gate is the hard block; this keeps non-Flash tiers out of the picker and
# every catalog-driven list so the UI never offers what the gate would refuse.
# Mirrored by the hot `llm-deepseek:` section in $DSH_HOME/settings.yaml.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities: [text, image]
        imagePixelBudget: 640000
        imageMaxBytes: 1048576

# ── dsh-context: project structure, rules and work orders as tools ─────────
# Exposes three tools to any agent on this harness: `context_module` (which module
# owns a path, what it exports, what it links to), `context_rules` (which rules the
# project claims and the exact command that fails when one is broken), `context_specs`
# (what work is in flight, which paths it claims, and where two active specifications
#
# Project-agnostic by design: it reads only `.dsh/project.json`, so a Python, C/C++
# or Unity repository gets the same three tools by writing its own manifest. A project
# without that file gets an actionable message naming it, never an empty result.
#
# Tools rather than documents on purpose: an agent calls a tool, while it ignores a
# documentation server almost always and a prose file about half the time.
- insert:
    - id: dsh-context
      name: '@cc/dsh-context'

# ── specs: the project's human-authored specs, injected every turn ─────────
# Contributes a system-prompt section carrying the specs a human wrote for the
# project the Session is open on. The section's text is a PROVIDER, re-evaluated on
# every assembly, so editing a spec file takes effect on the next request with no
# restart, and a subagent reads the same project's specs as its parent because both
# resolve the project from their own Session header.
#
# It is READ-ONLY: the plugin compiles nothing, checks nothing and writes nothing.
# There are no laws, no checks, no verdicts and no consent in this deployment; specs
# are advisory requirements a human owns, and the only thing this row does is put
# them in front of the model.
- insert:
    - id: specs
      name: '@cc/dsh-specs'

# ── adr-panel: the specs window ─────────────────────────────────────────────
# Two halves. The browser bundle adds a Session-header button labelled SPECS that
# opens a frame-wide overlay; the host half serves one capability-fenced route that
# lists, writes and deletes `<project>/docs/specs/*.md` for the Session the window is
# open on, resolving the project from that Session's own header rather than from the
# server's launch directory.
#
# It is storage, not machinery: it compiles nothing, verifies nothing, mints no
# consent and keeps no ledger. The only rule it enforces is that a write stays
# inside the project's specs directory.
- insert:
    - id: adr-panel
      name: '@cc/dsh-adr-panel'

# ── presentation: decks the agent renders, shown by the file preview ────────
# Contributes one tool, `presentation`, which turns a JSON deck spec into a
# standalone HTML file in the session workspace. There is no client half on
# purpose: the Sidebar document preview already renders `.html` in a script-
# enabled sandboxed frame, so the deck is its own viewer, and the very file the
# user previews is the one they export and print — preview, export and PDF cannot
# drift apart because they are the same document.
- insert:
    - id: presentation
      name: '@cc/dsh-presentation'

# ── work-modes: the subagent delegation cap ────────────────────────────────────
# One deployment policy on the harness seam that can actually refuse something.
#
# The cap is a monotonic tools.guard(): the third `subagent` child of one session
# (grandchildren included) is refused before its body runs, with the two running
# agents named, so the calling agent decides whether to batch, finish its own step
# or retry. A `workflow` fan-out is deliberately OUTSIDE this cap — it is a cap on
# the delegation tool, not a ceiling on concurrent work.
#
# The cap's residual, stated where the cap is: a child this process can see keeps
# its slot until the harness's agent registry stops holding it, so a child the
# registry never disposes keeps its slot for as long as it is held; an entry NO
# registry answered for (an out-of-process child, no `agents` service, a liveness
# probe that threw) is released by the age bound instead, so it stops being counted
# after `staleAfterMs` while it may still be running. That is the strongest true
# statement, and the plugin's own header carries it beside the code.
#
# There are NO work modes: the research/implementation mode was removed with the
# decision-record machinery it rested on, and the plugin injects no prompt section.
- insert:
    - id: work-modes
      name: '@cc/dsh-work-modes'

# ── godot-mcp: a declarative, transferable MCP server list ──────────────────
# The harness ships an MCP client bridge (`@deepseek-ai/dsh-mcp-client`), so this
# plugin speaks no MCP itself. It owns the three things the bridge does not do:
# the canonical server list, the resolution of the `uvx` launcher that the Godot
# AI bridge cannot start without, and the Godot project directory that bridge
# must be started in.
#
# Why a plugin and not a row in this file. A hand-written row here would carry a
# version pin that has to track the addon committed in the project, and the value
# of a spec is that the pin lives in one place that a check can compare. The row
# the loader actually reads is written into the harness HOME patch layer
# (`$DSH_HOME/cordis.patch.yml`, applied over every profile) by
# `scripts/dsh-mcp-sync.mjs`, which imports this plugin's own `buildRow`, so the
# spec format and the row shape cannot drift apart. The HOME layer is used rather
# than this profile layer because one row then serves every profile.
#
# The plugin needs no harness package: it reads one JSON file and contributes one
# system-prompt section that reports, per declared server, whether its launcher
# was found. Everything else - connecting, naming tools `mcp__<server>__<tool>`,
# reconnecting, projecting results - is the shipped bridge's job and is fixed by
# its own tests.
- insert:
    - id: godot-mcp
      name: '@cc/dsh-godot-mcp'
