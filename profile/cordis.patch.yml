          # to docs/cases/ and the test roots, so a product path is refused before it is written.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
