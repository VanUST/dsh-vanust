<title>Где сжимается контекст (измерено 12.11.2026)</title>
<style>
/* =============================================================================
   DSH Diagrams Style Kit — theme.css
   PURPOSE: one token layer + one component layer + swappable themes, so a diagram is
            rethemed by changing a single attribute (data-theme) and every colour stays
            a token. The palette is the one the presentation plugin already uses, so a
            diagram and a deck from the same workspace look like the same family.
   USAGE:   put `data-theme="ember|graphite|aurora|mono|paper"` on <html>; the renderer
            emits `data-color` on nodes, edges, bands and lifelines, and this file maps
            that name onto the theme's token.
   INPUTS:  none (pure CSS; no external file, no font download, no JS).
   OUTPUTS: styles for the document chrome (.dg-bar/.dg-stage/.dg-foot), the SVG
            components (.dg-node/.dg-edge/.dg-band/.dg-lifeline) and the arrow markers
            (.dg-marker). An unknown theme falls back to ember, which is declared on
            :root.
   KEYWORDS: diagrams, design-system, tokens, theme, svg, css, dsh, plugin.
   NOTE:    components never hard-code a hex value — that is what makes the five themes
            a pure override. The `[data-color]` block at the end must stay after the
            component defaults: both selectors weigh the same, so source order is what
            lets a declared colour beat a component's own.
   ============================================================================= */

/* ---------------------------------------------------------------- 1. SCALES */
:root{
  /* type: the same nine-step scale the presentation kit uses */
  --fs-xs:11.5px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px;
  --fs-2xl:26px; --fs-3xl:36px; --fs-4xl:48px; --fs-5xl:58px;
  --fs-kicker:14.5px;
  --lh-tight:1.08; --lh-body:1.45; --lh-loose:1.55;
  --ls-kicker:.22em; --ls-tight:-.01em;

  /* spacing: 4px base */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-10:64px;

  /* radii and motion */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --t-fast:.15s; --t-med:.35s;

  /* The document preview loads this file from the iframe itself, so no font may be
     fetched: the stack is system fonts all the way down. */
  --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --font-display:var(--font-sans);
}

/* ---------------------------------------------------------------- 2. THEMES */
/* Every theme defines the same semantic tokens, nothing else. */

:root, [data-theme="ember"]{
  --bg:#171310; --outer:#0d0b09;
  --panel:#1b1611; --panel-2:#241c14;
  --ink:#f2ece4; --ink-2:#d8cdbc; --muted:#b3a08a;
  --accent:#e9a13b; --accent-ink:#1c150d;
  --info:#6ea8e0; --ok:#7cc08b; --danger:#d96b5c; --violet:#a78bdc; --cyan:#6cc4bd;
  --warn:#e0b34f;
  --line:rgba(233,161,59,.16); --line-2:rgba(240,230,215,.18);
  --glow:rgba(233,161,59,.05);
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --radius-frame:16px;
}

[data-theme="graphite"]{
  --bg:#101418; --outer:#070a0d;
  --panel:#141a20; --panel-2:#1b232b;
  --ink:#e8eef4; --ink-2:#c3ceda; --muted:#93a5b6;
  --accent:#4fb3d9; --accent-ink:#05202b;
  --info:#5b8ff0; --ok:#5fbf8f; --danger:#e0705f; --violet:#9d8cf0; --cyan:#57c8c0;
  --warn:#e0b34f;
  --line:rgba(79,179,217,.20); --line-2:rgba(200,220,235,.16);
  --glow:rgba(79,179,217,.07);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --radius-frame:14px;
}

[data-theme="aurora"]{
  --bg:#0d1224; --outer:#060814;
  --panel:#131a33; --panel-2:#1a2242;
  --ink:#eaeefb; --ink-2:#b9c3e6; --muted:#8b96bd;
  --accent:#8b7bff; --accent-ink:#0b0820;
  --info:#63b6ff; --ok:#4fd8c0; --danger:#ff6f7d; --violet:#c08cff; --cyan:#4fd8c0;
  --warn:#ffc46b;
  --line:rgba(139,123,255,.24); --line-2:rgba(200,210,255,.16);
  --glow:rgba(139,123,255,.10);
  --shadow:0 26px 70px rgba(4,6,20,.6);
  --radius-frame:18px;
}

[data-theme="mono"]{
  --bg:#0b0b0c; --outer:#050505;
  --panel:#121213; --panel-2:#1a1a1c;
  --ink:#eaeaea; --ink-2:#bfbfbf; --muted:#8a8a8a;
  --accent:#b6f24a; --accent-ink:#0d1500;
  --info:#7fd4ff; --ok:#8fe08f; --danger:#ff7a6b; --violet:#c9a0ff; --cyan:#7fe0d0;
  --warn:#e8d06a;
  --line:rgba(182,242,74,.22); --line-2:rgba(255,255,255,.16);
  --glow:rgba(182,242,74,.05);
  --shadow:0 24px 60px rgba(0,0,0,.6);
  --radius-frame:6px;
  --font-display:var(--font-mono);
  --ls-kicker:.16em;
}

[data-theme="paper"]{
  --bg:#f7f4ef; --outer:#e5e0d6;
  --panel:#ffffff; --panel-2:#fbf8f3;
  --ink:#1d1a15; --ink-2:#4a4238; --muted:#7c7060;
  --accent:#a8661a; --accent-ink:#ffffff;
  --info:#2f6fb0; --ok:#2f7d4f; --danger:#b5432f; --violet:#6a4fa8; --cyan:#1f7d76;
  --warn:#9a7415;
  --line:rgba(168,102,26,.24); --line-2:rgba(30,26,20,.14);
  --glow:rgba(168,102,26,.06);
  --shadow:0 14px 34px rgba(60,45,20,.14);
  --radius-frame:12px;
}

/* The neutral an edge uses when the spec names no colour. */
:root{ --dg-edge: color-mix(in srgb, var(--ink) 42%, transparent); }

/* ------------------------------------------------------- 3. RESET AND CHROME */
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-sans);
  font-size:var(--fs-md); line-height:var(--lh-body); -webkit-font-smoothing:antialiased;
}
.dg{display:flex; flex-direction:column; height:100vh; overflow:hidden}

.dg-bar{
  display:flex; align-items:center; gap:10px; flex:none;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
}
.dg-heading{display:flex; flex-direction:column; min-width:0; margin-right:6px}
.dg-title{font-size:var(--fs-md); font-weight:700; letter-spacing:var(--ls-tight); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dg-subtitle{font-size:var(--fs-xs); color:var(--muted)}
.dg-chip{
  font-size:10.5px; letter-spacing:var(--ls-kicker); text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px 9px;
  white-space:nowrap;
}
.dg-chip--dim{opacity:.75}
.dg-grow{flex:1}
.dg-btn{
  width:30px; height:30px; display:grid; place-items:center; flex:none; cursor:pointer;
  font:inherit; font-size:13px; color:var(--ink); border-radius:var(--r-sm);
  border:1px solid var(--line); background:color-mix(in srgb, var(--accent) 8%, transparent);
  transition:background var(--t-fast);
}
.dg-btn:hover{background:color-mix(in srgb, var(--accent) 18%, transparent)}
.dg-btn:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset:1px}

.dg-stage{
  position:relative; flex:1; overflow:hidden; cursor:grab; touch-action:none;
  background-color:var(--bg);
  background-image:radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1px);
  background-size:22px 22px;
}
.dg-grabbing{cursor:grabbing}
#dg-svg{position:absolute; top:0; left:0; transform-origin:0 0; max-width:none; max-height:none}

.dg-foot{
  display:flex; align-items:center; gap:14px; flex:none;
  padding:7px 16px; border-top:1px solid var(--line);
  color:var(--muted); font-family:var(--font-mono); font-size:var(--fs-xs);
}
.dg-hint{opacity:.85}

/* ------------------------------------------------------- 4. SVG COMPONENTS */
.dg-svg{ font-family:var(--font-sans); }
.dg-svg text{ font-family:var(--font-sans); user-select:none }

.dg-node{ --nc:var(--ink-2); --nb:color-mix(in srgb, var(--nc) 14%, var(--panel)) }
.dg-node__shape{ fill:var(--nb); stroke:var(--nc); stroke-width:1.4; stroke-linejoin:round }
.dg-node__shape--solid{ fill:var(--nc); stroke:none }
.dg-node__detail{ stroke:var(--nc); stroke-width:1.2; opacity:.75 }
.dg-node__label{ fill:var(--ink); font-size:14px; font-weight:600 }
.dg-node__note{ fill:var(--muted); font-size:11.5px }
.dg-node[data-shape="start"] .dg-node__shape{ fill:var(--nc); stroke:none }
.dg-node[data-shape="start"] .dg-node__note,
.dg-node[data-shape="end"] .dg-node__note{ fill:var(--muted) }

.dg-edge{ --nc:var(--dg-edge) }
.dg-edge__line{ fill:none; stroke:var(--nc); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
.dg-edge[data-style="dashed"] .dg-edge__line{ stroke-dasharray:7 5 }
.dg-edge[data-style="dotted"] .dg-edge__line{ stroke-dasharray:2 4.5 }
.dg-edge[data-style="thick"] .dg-edge__line{ stroke-width:2.9 }
.dg-edge__labelbg{ fill:var(--bg); opacity:.92 }
.dg-edge__label{ fill:var(--ink-2); font-size:12px; font-weight:600 }

.dg-marker{ --nc:var(--dg-edge) }
.dg-marker__path{ fill:var(--nc) }

.dg-band{ --nc:var(--muted) }
.dg-band__rect{
  fill:color-mix(in srgb, var(--nc) 7%, transparent);
  stroke:color-mix(in srgb, var(--nc) 32%, transparent); stroke-width:1.2; stroke-dasharray:7 6;
}
.dg-band__label{ fill:var(--nc); font-size:11.5px; font-weight:700; letter-spacing:var(--ls-kicker); text-transform:uppercase }

.dg-lifeline{ --nc:var(--muted) }
.dg-lifeline{ stroke:color-mix(in srgb, var(--nc) 50%, transparent); stroke-width:1.4; stroke-dasharray:6 6 }

/* ------------------------------------------------- 5. DECLARED COLOUR WINS */
/* Kept last on purpose: `.dg-node` and `[data-color]` weigh the same, so this block's
   position is what lets a spec's colour beat the component default. */
[data-color="accent"]{ --nc:var(--accent) }
[data-color="info"]{ --nc:var(--info) }
[data-color="ok"]{ --nc:var(--ok) }
[data-color="warn"]{ --nc:var(--warn) }
[data-color="danger"]{ --nc:var(--danger) }
[data-color="violet"]{ --nc:var(--violet) }
[data-color="cyan"]{ --nc:var(--cyan) }
[data-color="muted"]{ --nc:var(--muted) }
[data-color="edge"]{ --nc:var(--dg-edge) }

/* ---------------------------------------------------- 6. LEGEND AND FRAMES */
.dg-legend{
  display:flex; align-items:center; gap:14px; flex:none; flex-wrap:wrap;
  padding:10px 16px; background:var(--panel); border-top:1px solid var(--line);
}
.dg-legend__title{
  font-size:10.5px; font-weight:700; letter-spacing:var(--ls-kicker);
  text-transform:uppercase; color:var(--muted);
}
.dg-legend__items{ display:flex; flex-wrap:wrap; gap:8px 18px; margin:0; padding:0; list-style:none }
.dg-legend__item{ display:flex; align-items:center; gap:7px; font-size:var(--fs-xs); color:var(--ink-2) }
.dg-swatch{ flex:none }

/* A sequence frame (alt/opt/loop) reads as a solid UML frame, not as a dashed band. */
.dg-frame .dg-band__rect{
  fill:color-mix(in srgb, var(--nc) 5%, transparent);
  stroke:color-mix(in srgb, var(--nc) 45%, transparent);
  stroke-width:1.2; stroke-dasharray:none;
}
.dg-frame__tag{
  fill:color-mix(in srgb, var(--nc) 16%, var(--panel));
  stroke:color-mix(in srgb, var(--nc) 45%, transparent); stroke-width:1.1;
}
.dg-frame__label{ fill:var(--ink-2); font-size:11.5px; font-weight:700; letter-spacing:.04em }

/* ---------------------------------------------------------------- 7. PRINT */
/* Paper is light whatever the screen theme is, so print RE-DECLARES the light palette.
   Without this a dark theme prints near-white labels and pale edges on a white page —
   the tokens would follow the theme while the page background is forced white. This rule
   must stay below every `[data-theme]` block: the selectors weigh the same, so source
   order is the only thing that lets it win. */
@media print{
  @page{ size:A4 landscape; margin:10mm }
  :root, [data-theme]{
    --bg:#fff; --panel:#fff; --panel-2:#fbf8f3;
    --ink:#1d1a15; --ink-2:#4a4238; --muted:#7c7060;
    --accent:#a8661a; --info:#2f6fb0; --ok:#2f7d4f; --warn:#9a7415;
    --danger:#b5432f; --violet:#6a4fa8; --cyan:#1f7d76;
    --line:rgba(168,102,26,.24); --line-2:rgba(30,26,20,.14);
  }
  html,body{ height:auto; overflow:visible; background:#fff }
  .dg-bar,.dg-foot{ display:none !important }
  .dg-legend{ background:#fff; border-top:none; padding:6px 0 0 }
  .dg-stage{
    position:static; overflow:visible; height:auto; padding:0; cursor:default;
    background:#fff; background-image:none;
  }
  #dg-svg{ position:static; transform:none !important; width:100%; height:auto }
}

</style>

</footer>
<script>
(function(){
  var themes=["ember","graphite","aurora","mono","paper"];
  var stage=document.getElementById('dg-stage');
  var svg=document.getElementById('dg-svg');
  var level=document.getElementById('dg-level');
  var box=svg.viewBox.baseVal;
  var k=1,tx=0,ty=0;
  function apply(){
    svg.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
    if(level)level.textContent=Math.round(k*100)+'%';
  }
  function fit(){
    var w=stage.clientWidth-48,h=stage.clientHeight-48;
    k=Math.min(w/box.width,h/box.height);
    if(k>1.6)k=1.6;
    tx=(stage.clientWidth-box.width*k)/2;
    ty=(stage.clientHeight-box.height*k)/2;
    apply();
  }
  function zoomAt(factor,x,y){
    var next=Math.max(0.12,Math.min(6,k*factor));
    var ratio=next/k;
    tx=x-(x-tx)*ratio; ty=y-(y-ty)*ratio; k=next; apply();
  }
  document.getElementById('dg-fit').addEventListener('click',fit);
  document.getElementById('dg-in').addEventListener('click',function(){zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2)});
  document.getElementById('dg-out').addEventListener('click',function(){zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2)});
  document.getElementById('dg-one').addEventListener('click',function(){k=1;tx=(stage.clientWidth-box.width)/2;ty=(stage.clientHeight-box.height)/2;apply()});
  document.getElementById('dg-theme').addEventListener('click',function(){
    var at=themes.indexOf(document.documentElement.dataset.theme);
    document.documentElement.dataset.theme=themes[(at+1)%themes.length];
  });
  stage.addEventListener('wheel',function(event){
    event.preventDefault();
    var rect=stage.getBoundingClientRect();
    zoomAt(event.deltaY<0?1.1:1/1.1,event.clientX-rect.left,event.clientY-rect.top);
  },{passive:false});
  var dragging=false,lastX=0,lastY=0;
  stage.addEventListener('pointerdown',function(event){
    if(event.target.closest('.dg-node'))return;
    dragging=true;lastX=event.clientX;lastY=event.clientY;
    stage.classList.add('dg-grabbing');stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener('pointermove',function(event){
    if(!dragging)return;
    tx+=event.clientX-lastX;ty+=event.clientY-lastY;
    lastX=event.clientX;lastY=event.clientY;apply();
  });
  stage.addEventListener('pointerup',function(event){
    dragging=false;stage.classList.remove('dg-grabbing');
    try{stage.releasePointerCapture(event.pointerId)}catch(error){}
  });
  addEventListener('keydown',function(event){
    if(event.key==='f'||event.key==='F')fit();
    else if(event.key==='t'||event.key==='T')document.getElementById('dg-theme').click();
    else if(event.key==='+'||event.key==='=')zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2);
    else if(event.key==='-')zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2);
  });
  addEventListener('resize',fit);
  fit();
})();
</script>
