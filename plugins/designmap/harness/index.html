<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>designmap M1 panel — real DSH loader harness</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f1f5f9; }
    body { display: flex; flex-direction: column; }
    #harness-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 12px;
      background: #0f172a;
      color: #cbd5e1;
      font: 11px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 30px;
    }
    #harness-bar strong { color: #f8fafc; font-weight: 650; }
    #harness-bar a { color: #93c5fd; text-decoration: none; font-weight: 600; }
    #harness-bar a:hover { text-decoration: underline; }
    #harness-bar a[aria-current="true"] { color: #f8fafc; text-decoration: underline; }
    #harness-bar .spacer { flex: 1; }
    #harness-bar button {
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 4px;
      padding: 2px 8px;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    #harness-bar button:hover { background: #334155; }
    #harness-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    #harness-bar #regen-status { color: #93c5fd; }
    #root { flex: 1; min-height: 0; }
    #boot-error { position: fixed; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #991b1b; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="harness-bar">
    <strong>M1 harness</strong>
    <span>real @deepseek-ai/dsh-client-modules loader · scripted remote</span>
    <span class="spacer"></span>
    <button id="regenerate" type="button" hidden>Regenerate scene</button>
    <span id="regen-status" role="status"></span>
    <span>scene set:</span>
    <a href="/?set=fixture" data-set-link="fixture">pinned fixture</a>
    <a href="/?set=m0" data-set-link="m0">M0 demo render</a>
    <a href="/?set=m2" data-set-link="m2">M2 editable workspace</a>
    <a href="/?set=repo" data-set-link="repo">this repository</a>
    <a href="/?set=readability" data-set-link="readability">readability fixtures</a>
    <a href="/?set=empty" data-set-link="empty">empty view</a>
  </div>
  <div id="root"></div>
  <pre id="boot-error" hidden></pre>

  <!-- The DSH index's queue facade, copied from @deepseek-ai/dsh-client-modules
       lib/index.js → bootInjections(). -->
  <script>
    (() => {
      const pendingQueue = []
      window.__ModuleLoader__ = {
        mode: 'queue',
        pendingQueue,
        load(registration) { pendingQueue.push(registration) },
        create(options) {
          if (this.mode !== 'queue') throw new Error('client-modules: window.__ModuleLoader__.create called after module-system boot')
          const index = pendingQueue.findIndex((registration) => registration.id === '@deepseek-ai/dsh-client-modules')
          const registration = pendingQueue[index]
          if (registration === undefined) throw new Error('client-modules: HTML did not preload @deepseek-ai/dsh-client-modules/client.js')
          pendingQueue.splice(index, 1)
          const exports = registration.factory((specifier) => {
            throw new Error('client-modules: @deepseek-ai/dsh-client-modules/client.js requested external "' + specifier + '" before the module system existed')
          })
          if (typeof exports !== 'object' || exports === null || typeof exports.createClientModuleSystem !== 'function' || typeof exports.apply !== 'function') {
            throw new Error('client-modules: @deepseek-ai/dsh-client-modules/client.js did not export the bootstrap module face')
          }
          return exports.createClientModuleSystem(this, { id: registration.id, exports }, options)
        },
      }
    })()
  </script>
  <script src="/seed.js"></script>
  <script src="/vendor/dsh-client-modules.client.js"></script>
  <script src="/client.js?rev=m1-harness"></script>
  <script src="/boot.js"></script>
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get('set')
      const set = requested === 'm0' || requested === 'empty' || requested === 'm2' || requested === 'repo' || requested === 'readability' ? requested : 'repo'
      if (set === 'm2') {
        const button = document.getElementById('regenerate')
        const status = document.getElementById('regen-status')
        button.hidden = false
        button.addEventListener('click', async () => {
          button.disabled = true
          status.textContent = 'regenerating…'
          try {
            const result = await window.__M2__?.regenerate?.()
            status.textContent = result?.ok === true ? 'scene regenerated' : `regenerate failed: ${result?.error?.message ?? 'unknown'}`
          } catch (error) {
            status.textContent = `regenerate failed: ${String(error?.message ?? error)}`
          } finally {
            button.disabled = false
          }
        })
      }
      for (const link of document.querySelectorAll('[data-set-link]')) {
        link.setAttribute('aria-current', link.dataset.setLink === set ? 'true' : 'false')
      }
    })()
  </script>
</body>
</html>
